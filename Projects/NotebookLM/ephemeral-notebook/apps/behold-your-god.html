<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behold Your God — Explorer & Quiz</title>
<style>
  :root {
    --bg: #070c16;
    --surface: #0f1726;
    --border: rgba(255,255,255,.10);
    --text: #e6edf7;
    --muted: #a9b6cc;
    --accent: #8bb9ff;
    --green: rgba(124,255,178,.92);
    --red: rgba(255,122,138,.95);
    --shadow: 0 12px 30px rgba(0,0,0,.35);
    --radius: 16px;
    --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: linear-gradient(180deg, #070c16 0%, #0b1220 50%, #070c16 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 20px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 32px; }
  header h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 700; letter-spacing: -.03em; margin-bottom: 8px; }
  header h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: .95rem; }

  .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  .tab {
    padding: 10px 22px; border-radius: 99px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); cursor: pointer;
    font-size: .9rem; font-weight: 600; transition: all .15s;
  }
  .tab.active {
    background: rgba(139,185,255,.12);
    border-color: rgba(139,185,255,.35);
    color: var(--accent);
  }
  .tab:hover:not(.active) { border-color: rgba(255,255,255,.2); color: var(--text); }

  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }

  label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .07em; }
  .select-wrap { position: relative; margin-bottom: 16px; }
  .select-wrap::after {
    content: '▾'; position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%); color: var(--muted);
    pointer-events: none; font-size: 1rem;
  }
  select {
    width: 100%; padding: 12px 36px 12px 16px; border-radius: 10px;
    background: #0b1422; border: 1px solid var(--border);
    color: var(--text); font-size: 1rem;
    appearance: none; cursor: pointer;
  }
  select:focus { outline: none; border-color: rgba(139,185,255,.4); }

  button.primary {
    background: linear-gradient(135deg, rgba(139,185,255,1), rgba(124,255,178,.92));
    color: #08101d; border: none; border-radius: 10px;
    padding: 12px 28px; font-size: .95rem; font-weight: 700;
    cursor: pointer; transition: opacity .15s;
  }
  button.primary:hover { opacity: .88; }
  button.primary:disabled { opacity: .4; cursor: not-allowed; }

  .status { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); margin-top: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.live { background: var(--accent); animation: pulse 1.2s infinite; }
  .dot.ok { background: var(--green); }
  .dot.bad { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .result { margin-top: 20px; }
  .result-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; color: var(--accent); }
  .result-summary { color: var(--muted); line-height: 1.7; margin-bottom: 18px; font-size: .95rem; }

  table { width: 100%; border-collapse: collapse; font-size: .88rem; margin-bottom: 18px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; padding: 0 12px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.05); line-height: 1.5; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td:first-child { color: var(--accent); font-weight: 600; white-space: nowrap; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip {
    padding: 7px 14px; border-radius: 99px;
    border: 1px solid rgba(139,185,255,.25);
    background: rgba(139,185,255,.07);
    color: var(--accent); font-size: .82rem; cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { background: rgba(139,185,255,.15); border-color: rgba(139,185,255,.45); }

  .chips-label { font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }

  /* Quiz */
  .question-text { font-size: 1.05rem; font-weight: 600; line-height: 1.6; margin-bottom: 18px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .option {
    padding: 13px 16px; border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent; color: var(--text);
    text-align: left; cursor: pointer; font-size: .93rem;
    transition: all .15s;
  }
  .option:hover:not(:disabled) { border-color: rgba(139,185,255,.35); background: rgba(139,185,255,.06); }
  .option.correct { border-color: var(--green); background: rgba(124,255,178,.08); color: var(--green); }
  .option.wrong { border-color: var(--red); background: rgba(255,122,138,.08); color: var(--red); }
  .option:disabled { cursor: default; }

  .explanation {
    background: rgba(139,185,255,.07);
    border: 1px solid rgba(139,185,255,.18);
    border-radius: 10px; padding: 14px 16px;
    font-size: .88rem; color: var(--muted); line-height: 1.65;
    margin-bottom: 16px;
  }

  .score-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px; font-size: .88rem; color: var(--muted);
  }
  .score-val { font-weight: 700; color: var(--accent); font-size: 1rem; }

  .progress { font-size: .82rem; color: var(--muted); margin-bottom: 14px; }

  .error { color: var(--red); font-size: .88rem; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Behold <span>Your God</span></h1>
    <p class="sub">Understanding divine character through F.T. Wright's framework · AI-powered explorer & quiz</p>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('explorer')">Explorer</button>
    <button class="tab" onclick="switchTab('quiz')">Quiz</button>
  </div>

  <!-- EXPLORER -->
  <div id="explorer" class="panel active">
    <div class="card">
      <label for="focus">Choose a theme</label>
      <div class="select-wrap">
      <select id="focus">
        <option value="god-not-criminal">God is Not a Criminal</option>
        <option value="nuclear-plant">The Nuclear Power Plant Technician</option>
        <option value="white-hat">White Hat, Black Hat</option>
        <option value="father-son-gun">The Father, the Son, and the Gun</option>
        <option value="prodigal-son">The Father of the Prodigal Son</option>
        <option value="rods-serpents">Rods and Serpents</option>
        <option value="boeing-747">The Boeing 747 Pilot</option>
        <option value="cross-dividing-line">The Cross as the Dividing Line</option>
        <option value="gods-destruction">Interpreting God's "Destruction"</option>
        <option value="law-character">The Law as God's Character</option>
      </select>
      </div>
      <button class="primary" id="exploreBtn" onclick="runExplorer()">Explore</button>
      <div class="status">
        <div class="dot" id="eDot"></div>
        <span id="eStatus">Ready</span>
      </div>
    </div>

    <div id="explorerResult"></div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="panel">
    <div class="card">
      <div class="score-bar">
        <span>Score</span>
        <span class="score-val" id="scoreDisplay">0 / 0</span>
      </div>
      <button class="primary" id="quizBtn" onclick="startQuiz()">New Quiz</button>
      <div class="status">
        <div class="dot" id="qDot"></div>
        <span id="qStatus">Ready</span>
      </div>
    </div>
    <div id="quizArea"></div>
  </div>

</div>

<script>
const PROXY = 'https://groq-proxy.ewalltom.workers.dev';
const MODEL = 'openai/gpt-oss-120b';

async function callAI(promptText) {
  const response = await fetch(PROXY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ role: 'user', parts: [{ text: promptText }] }],
      generationConfig: { responseMimeType: 'text/plain' },
      model: MODEL
    })
  });
  const raw = await response.text();
  let data;
  try { data = JSON.parse(raw); }
  catch { throw new Error(`Non-JSON from proxy (HTTP ${response.status}): ${raw.slice(0,300)}`); }
  if (!response.ok) throw new Error(data?.error?.message || `HTTP ${response.status}`);
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!text) throw new Error('No text in AI response');
  return text;
}

function extractJson(text) {
  let t = String(text).trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) t = fence[1].trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) t = t.slice(a, b + 1);
  try { return JSON.parse(t); } catch { return null; }
}

// ── FOCUS PROMPTS ─────────────────────────────────────────────────────────────

const FOCUS_PROMPTS = {
  'god-not-criminal': `In "Behold Your God: Understanding Divine Character," F.T. Wright argues that God does not operate like a crime syndicate that demands tribute and violently destroys property or lives if people refuse to comply. The central argument is that God never uses criminal or coercive force to extract obedience. While humans often justify violence for a "good cause," Wright insists the end never justifies the means — and God never operates this way. God's governance is built entirely on love and freedom, not compulsion. Even when humans reject Him, God does not retaliate with force or threaten punishment as a means of securing compliance. This theme challenges the popular conception of God as a divine enforcer whose wrath must be appeased, replacing it with a picture of a God who wins allegiance only through revelation of His character.`,

  'nuclear-plant': `F.T. Wright uses the illustration of a nuclear power plant technician to explain how God "destroys" by withdrawing protection rather than by active violence. In the story, a skilled technician faithfully maintains a dangerous nuclear facility near a hostile town whose residents despise him. Despite their hatred, he stays at his post because his presence prevents catastrophe. Only when the townspeople physically force him out does he leave. When the plant subsequently explodes, the technician is not the destroyer — he was prevented from saving them. Wright applies this directly to God: when Scripture says "God destroys," it means God reluctantly withdrew His protective presence in response to human rejection, allowing sin's natural self-destructive consequences to unfold. God is always the one being pushed out, never the aggressor.`,

  'white-hat': `F.T. Wright uses the Hollywood Western as an illustration of how Satan educates humanity about the nature of power and law. In the typical Western, the villain (dressed in dark clothes) lies, steals, and kills. The hero arrives and stops him — but does so by also lying, stealing, and killing. The audience cheers, unconsciously absorbing Satan's core philosophy: that the law must be broken in order to uphold the law, that the end justifies the means, that good can use evil methods. Wright argues this is Satan's most successful educational tool. Christ utterly rejected this framework. God never breaks His own law to enforce it. He never uses deception, manipulation, or force to achieve righteous ends. The cross itself is the supreme demonstration: God absorbed violence rather than retaliating with it.`,

  'father-son-gun': `To explain why a non-violent God gave laws permitting warfare and punishment in the Old Testament, F.T. Wright tells the story of a non-hunting father whose son insists on buying a rifle against his father's wishes. Unable to forcibly remove the weapon without violating his son's freedom, the father acts as a "saviour" by teaching the boy to use it safely — minimizing the damage the son has stubbornly chosen to bring into his life. Wright applies this to Israel: when Israel rejected God's non-violent theocratic protection and demanded to be like other nations — taking up the sword — God went the "second mile." Rather than abandoning them to unrestrained violence, He gave them rules of warfare, proportional justice, and protective laws to minimize the evil they had chosen. These laws reveal God's mercy within human stubbornness, not His approval of violence.`,

  'prodigal-son': `Wright uses the Parable of the Prodigal Son to illustrate God's restorative character — specifically His eagerness to forgive without demanding penance, payment, or that the sinner "pay their debt to society." When the wayward son returns, the father does not lecture him, extract confession in detail, or impose a probationary period. He runs to meet him and restores him immediately and fully, as if the rebellion had never occurred. Wright contrasts this with the human instinct for revenge and proportional punishment. The older brother's anger mirrors the theological assumption that justice requires suffering before restoration can occur. God's justice, Wright argues, is restorative not retributive. The father's response is not a suspension of justice — it is the truest expression of it.`,

  'rods-serpents': `When Aaron cast Moses' rod before Pharaoh and it became a serpent, Wright sees an acted parable about the nature of God's protective hold on creation. While Aaron held the rod, it remained a harmless staff. Released from his grasp, it became a devouring serpent. Wright argues this warned Pharaoh — and warns us — that the mighty forces of nature are safe only while held in God's directing hand. When God is rejected and forced to withdraw, those same forces become chaotic and destructive. This reframes the plagues of Egypt: not as God actively afflicting Egypt with violence, but as God progressively withdrawing His restraining protection in response to Pharaoh's repeated rejection, allowing natural chaos to fill the vacuum. The serpent didn't need to be made dangerous — it only needed to be released.`,

  'boeing-747': `F.T. Wright uses the image of a Boeing 747 to illustrate humanity's total dependence on God and the inevitable consequences of displacing Him. If an untrained passenger overpowers a highly skilled pilot mid-flight, the plane will crash — not because the pilot retaliates, but because the passenger has removed the one person capable of safely operating the aircraft. Wright applies this to the human condition: God is the only one capable of sustaining the complex forces of life and existence. When humanity chooses Satan as its ruler — displacing God — disaster becomes inevitable, not as a punishment imposed from outside but as the natural result of removing the one sustaining presence. The crash is not God's judgment in the punitive sense; it is the predictable outcome of rejecting the only pilot who can fly.`,

  'cross-dividing-line': `The cross is the supreme dividing line between God's character and Satan's in Wright's framework. Wright identifies two crosses: Satan's counterfeit cross (the cross of Babylon) operates on the principle of self-service at the expense of others — using control, compulsion, and the threat of suffering to secure obedience. This is the cross of domination. The cross of Christ reveals the opposite: God's self-sacrificing service for others at the ultimate cost to Himself, with no coercion and no retaliation. At Calvary, Satan demonstrated there is no limit to how far he will go — he moved all of human and religious power to destroy the Son of God. God demonstrated there is no limit to how far He will go in love — absorbing that violence without retaliating, forgiving His executioners, and dying to reveal truth rather than to extract a legal payment. The cross proves both characters simultaneously.`,

  'gods-destruction': `One of the central hermeneutical reframings in "Behold Your God" is the reinterpretation of biblical language about God destroying or killing. Wright's thesis is that when Scripture attributes destruction to God, it means God reluctantly withdrew His protective presence in response to sustained human rejection, allowing sin's natural, self-destructive consequences to take their course. God does not actively rain down violence — He holds back chaos, and when He is rejected and forced to withdraw, chaos fills the space He vacated. This reframing applies to the Flood, the destruction of Sodom, the plagues of Egypt, and the deaths in the wilderness. In each case, Wright argues, reading the text carefully reveals God warning, pleading, and delaying — and destruction following only after sustained rejection. God is always the one being expelled, not the one attacking.`,

  'law-character': `Wright argues that God's law is not an arbitrary set of rules designed to protect His authority or secure His honor. The law is the very transcript of God's character — it describes how love behaves in relationship. Because God is perfect love and values absolute freedom, He never uses compelling force or coercion to secure obedience to that law. Obedience obtained by force or fear is not the obedience the law describes — it is a contradiction in terms. This means God cannot violate His own law to enforce it (the White Hat problem), cannot threaten violence to achieve compliance (the Criminal problem), and cannot demand suffering as satisfaction before forgiving (the Prodigal Son problem). Every apparent exception in Scripture — every moment where God seems to command violence, demand death, or withhold forgiveness — must be reread in light of this foundational principle.`
};

// ── TAB SWITCHING ──────────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => {
    if (t.textContent.toLowerCase().includes(name === 'explorer' ? 'explorer' : 'quiz')) t.classList.add('active');
  });
}

// ── EXPLORER ──────────────────────────────────────────────────────────────────

function setEStatus(state, msg) {
  document.getElementById('eDot').className = 'dot ' + state;
  document.getElementById('eStatus').textContent = msg;
}

async function runExplorer(overrideQuestion) {
  const key = document.getElementById('focus').value;
  const knowledge = FOCUS_PROMPTS[key];
  const focusLabel = document.getElementById('focus').options[document.getElementById('focus').selectedIndex].text;
  const question = overrideQuestion || `Explain the theme "${focusLabel}" as presented in this book.`;

  document.getElementById('exploreBtn').disabled = true;
  setEStatus('live', 'Thinking…');
  document.getElementById('explorerResult').innerHTML = '';

  const prompt = `You are an expert on the book "Behold Your God: Understanding Divine Character" by F.T. Wright.
Use ONLY the following source knowledge to answer. Do not add outside information.

SOURCE KNOWLEDGE:
${knowledge}

QUESTION: ${question}

Respond in this exact JSON format:
{
  "title": "short descriptive title for this response",
  "summary": "2-3 sentence overview of the theme",
  "items": [
    { "name": "concept or sub-point", "key_figure_or_date": "relevant figure, text, or detail", "description": "explanation", "significance": "why this matters to the book's argument" }
  ],
  "follow_up_questions": ["question 1", "question 2", "question 3", "question 4"]
}
Return 6-8 items. Make the follow-up questions probing and specific to this book's framework.`;

  try {
    const raw = await callAI(prompt);
    const data = extractJson(raw);
    if (!data) throw new Error('Could not parse response');
    renderExplorerResult(data, knowledge);
    setEStatus('ok', 'Done');
  } catch(e) {
    setEStatus('bad', 'Error: ' + e.message);
    document.getElementById('explorerResult').innerHTML = `<p class="error">${e.message}</p>`;
  }
  document.getElementById('exploreBtn').disabled = false;
}

let _chipQuestions = [];

function renderExplorerResult(data, knowledge) {
  const items = (data.items || []).map(it => `
    <tr>
      <td>${it.name || ''}</td>
      <td>${it.key_figure_or_date || '—'}</td>
      <td>${it.description || ''}</td>
      <td>${it.significance || ''}</td>
    </tr>`).join('');

  _chipQuestions = data.follow_up_questions || [];
  const chips = _chipQuestions.map((q, i) =>
    `<button class="chip" onclick="runExplorerChip(${i})">${q}</button>`
  ).join('');

  document.getElementById('explorerResult').innerHTML = `
    <div class="card result">
      <div class="result-title">${data.title || ''}</div>
      <div class="result-summary">${data.summary || ''}</div>
      <table>
        <thead><tr><th>Concept</th><th>Key Detail</th><th>Description</th><th>Significance</th></tr></thead>
        <tbody>${items}</tbody>
      </table>
      <div class="chips-label">Explore further</div>
      <div class="chips">${chips}</div>
    </div>`;
}

function runExplorerChip(idx) {
  runExplorer(_chipQuestions[idx]);
}

// ── QUIZ ──────────────────────────────────────────────────────────────────────

let quizState = { score: 0, total: 0, questions: [], current: 0, answered: false, askedQuestions: [] };

function setQStatus(state, msg) {
  document.getElementById('qDot').className = 'dot ' + state;
  document.getElementById('qStatus').textContent = msg;
}

function updateScore() {
  document.getElementById('scoreDisplay').textContent = `${quizState.score} / ${quizState.total}`;
}

const QUIZ_SCOPE = `The book "Behold Your God: Understanding Divine Character" by F.T. Wright covers these key arguments and themes:
- God never uses coercive force, compulsion, or violence to secure obedience — His law is a transcript of His love.
- When the Bible says "God destroys," it means God withdrew His protection, allowing sin's natural consequences.
- The Nuclear Power Plant illustration: God is like a technician forced out by hostile people; the resulting explosion is not His doing.
- The "God is Not a Criminal" argument: God never operates like a crime syndicate demanding tribute under threat of violence.
- White Hat, Black Hat (Hollywood Western): Satan's philosophy says the end justifies the means; God never breaks His law to enforce it.
- The Father, the Son, and the Gun: God gave Israel rules of warfare not because He approved of war but to minimize evil they had chosen.
- The Father of the Prodigal Son: God restores without demanding penance, payment, or probationary periods — restoration is immediate.
- Rods and Serpents: forces of nature are safe in God's hand; released by His withdrawal, they become destructive.
- The Boeing 747: humanity's rejection of God removes the only one capable of sustaining life's complex forces.
- The Cross: Satan's cross uses compulsion and self-service; Christ's cross reveals self-sacrificing love with no retaliation.
- The great controversy is about God's character — whether He governs by love or by force.`;

async function startQuiz() {
  document.getElementById('quizBtn').disabled = true;
  setQStatus('live', 'Generating questions…');
  document.getElementById('quizArea').innerHTML = '';

  const avoidStr = quizState.askedQuestions.length
    ? `\n\nAvoid repeating these questions:\n${quizState.askedQuestions.slice(-15).join('\n')}`
    : '';

  const prompt = `You are a quiz master for the book "Behold Your God: Understanding Divine Character" by F.T. Wright.
Generate 5 multiple-choice questions based on this knowledge scope:

${QUIZ_SCOPE}${avoidStr}

Return ONLY valid JSON in this exact format:
{
  "questions": [
    {
      "question": "question text",
      "options": ["A. option", "B. option", "C. option", "D. option"],
      "correct": "A",
      "explanation": "why this is correct and what the book says"
    }
  ]
}
Make questions specific to the book's unique arguments and illustrations, not generic theology.`;

  try {
    const raw = await callAI(prompt);
    const data = extractJson(raw);
    if (!data || !data.questions) throw new Error('Could not parse questions');

    // Shuffle correct answer into random position
    const questions = data.questions.map(q => {
      const letters = ['A','B','C','D'];
      const correctIdx = letters.indexOf(q.correct);
      if (correctIdx < 0) return q;
      const correctText = q.options[correctIdx];
      const newPos = Math.floor(Math.random() * 4);
      const opts = [...q.options];
      // swap correct to newPos
      [opts[correctIdx], opts[newPos]] = [opts[newPos], opts[correctIdx]];
      return { ...q, options: opts, correct: letters[newPos], correctText };
    });

    quizState.questions = questions;
    quizState.current = 0;
    quizState.answered = false;
    quizState.askedQuestions.push(...questions.map(q => q.question));

    renderQuestion();
    setQStatus('ok', 'Ready');
  } catch(e) {
    setQStatus('bad', 'Error: ' + e.message);
    document.getElementById('quizArea').innerHTML = `<p class="error">${e.message}</p>`;
  }
  document.getElementById('quizBtn').disabled = false;
}

function renderQuestion() {
  const q = quizState.questions[quizState.current];
  if (!q) return;

  const letters = ['A','B','C','D'];
  const options = q.options.map((opt, i) => `
    <button class="option" onclick="answerQuestion('${letters[i]}')" id="opt-${letters[i]}">${opt}</button>
  `).join('');

  document.getElementById('quizArea').innerHTML = `
    <div class="card">
      <div class="progress">Question ${quizState.current + 1} of ${quizState.questions.length}</div>
      <div class="question-text">${q.question}</div>
      <div class="options">${options}</div>
      <div id="explanation"></div>
      <div id="nextWrap"></div>
    </div>`;
}

function answerQuestion(chosen) {
  if (quizState.answered) return;
  quizState.answered = true;

  const q = quizState.questions[quizState.current];
  const correct = q.correct;
  quizState.total++;
  if (chosen === correct) quizState.score++;
  updateScore();

  ['A','B','C','D'].forEach(l => {
    const btn = document.getElementById('opt-' + l);
    if (!btn) return;
    btn.disabled = true;
    if (l === correct) btn.classList.add('correct');
    else if (l === chosen) btn.classList.add('wrong');
  });

  document.getElementById('explanation').innerHTML =
    `<div class="explanation">${q.explanation || ''}</div>`;

  const isLast = quizState.current >= quizState.questions.length - 1;
  document.getElementById('nextWrap').innerHTML = isLast
    ? `<button class="primary" onclick="startQuiz()">New Quiz</button>`
    : `<button class="primary" onclick="nextQuestion()">Next Question</button>`;
}

function nextQuestion() {
  quizState.current++;
  quizState.answered = false;
  renderQuestion();
}
</script>
</body>
</html>
