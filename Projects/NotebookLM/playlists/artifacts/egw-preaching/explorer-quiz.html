<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EGW on Preaching — Explorer &amp; Quiz</title>
  <style>
    :root {
      --bg: #070c16; --surface: #0f1726; --border: rgba(255,255,255,.10);
      --text: #e6edf7; --muted: #a9b6cc; --accent: #8bb9ff;
      --green: rgba(124,255,178,.92); --red: rgba(255,122,138,.95);
      --shadow: 0 12px 30px rgba(0,0,0,.35); --radius: 16px;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: linear-gradient(180deg,#070c16 0%,#0b1220 50%,#070c16 100%); color: var(--text); min-height: 100vh; padding: 28px 20px; }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab { padding: 9px 20px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer; }
    .tab.active { background: rgba(139,185,255,.12); border-color: rgba(139,185,255,.35); color: var(--accent); }
    .tabpanel { display: none; }
    .tabpanel.active { display: block; }
    .card { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
    .card-hd { padding: 12px 16px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,.14); display: flex; align-items: center; justify-content: space-between; }
    .card-hd h2 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .2px; }
    .card-bd { padding: 16px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    select { width: 100%; background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.12); color: var(--text); border-radius: 12px; padding: 10px 34px 10px 12px; font-family: var(--sans); font-size: 14px; outline: none; appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg,transparent 50%,rgba(230,237,247,.85) 50%),linear-gradient(135deg,rgba(230,237,247,.85) 50%,transparent 50%); background-position: calc(100% - 18px) 50%,calc(100% - 12px) 50%; background-size: 6px 6px,6px 6px; background-repeat: no-repeat; }
    select:focus { border-color: rgba(139,185,255,.55); box-shadow: 0 0 0 3px rgba(139,185,255,.14); }
    select option { background: #0f1726; color: var(--text); }
    .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    button { cursor: pointer; border: none; border-radius: 12px; padding: 10px 18px; font-family: var(--sans); font-size: 14px; font-weight: 650; }
    .btn-primary { background: linear-gradient(135deg,rgba(139,185,255,1),rgba(124,255,178,.92)); color: #08101d; box-shadow: var(--shadow); }
    .btn-secondary { background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--border); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 999px; background: rgba(255,255,255,.2); flex-shrink: 0; }
    .dot.live { background: var(--accent); box-shadow: 0 0 0 3px rgba(139,185,255,.18); }
    .dot.ok { background: var(--green); box-shadow: 0 0 0 3px rgba(124,255,178,.18); }
    .dot.bad { background: var(--red); box-shadow: 0 0 0 3px rgba(255,122,138,.18); }
    .summary { font-size: 14px; line-height: 1.6; color: var(--text); margin-bottom: 14px; }
    .tablewrap { overflow: auto; border-radius: 12px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; background: rgba(0,0,0,.18); }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.07); font-size: 13px; line-height: 1.45; vertical-align: top; }
    th { color: var(--muted); font-weight: 700; background: rgba(0,0,0,.16); font-size: 12px; }
    tr:last-child td { border-bottom: none; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .chip { font-size: 12px; padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); color: var(--text); cursor: pointer; transition: border-color .15s, background .15s; }
    .chip:hover { border-color: rgba(139,185,255,.45); background: rgba(139,185,255,.09); color: var(--accent); }
    .chip.used { border-color: rgba(139,185,255,.3); background: rgba(139,185,255,.07); color: var(--accent); }
    .question-text { font-size: 16px; font-weight: 600; line-height: 1.55; margin-bottom: 20px; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn { text-align: left; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,.04); color: var(--text); font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; transition: border-color .15s, background .15s; }
    .option-btn:hover:not(:disabled) { border-color: rgba(139,185,255,.45); background: rgba(139,185,255,.07); }
    .option-btn.correct { border-color: rgba(124,255,178,.6); background: rgba(124,255,178,.10); }
    .option-btn.wrong { border-color: rgba(255,122,138,.6); background: rgba(255,122,138,.08); }
    .option-btn:disabled { cursor: default; }
    .explanation { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--border); font-size: 13px; line-height: 1.6; color: var(--text); display: none; }
    .explanation.show { display: block; }
    .chip-history-note { font-size: 11px; color: var(--muted); margin-top: 10px; opacity: 0.7; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Ellen G. White on Preaching</h1>
  <div class="sub">White's theology of the pulpit · AI-powered explorer &amp; quiz</div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('explorer',this)">Explorer</button>
    <button class="tab" onclick="switchTab('quiz',this)">Quiz</button>
  </div>

  <!-- EXPLORER -->
  <div class="tabpanel active" id="tab-explorer">
    <div class="card">
      <div class="card-hd"><h2>Query</h2></div>
      <div class="card-bd">
        <label for="focus">Focus</label>
        <select id="focus">
          <option value="center">Christ at the Center</option>
          <option value="word">The Word over Feeling</option>
          <option value="law">Law and Gospel Together</option>
          <option value="heart">Reaching the Heart</option>
          <option value="experience">The Preacher's Own Experience</option>
          <option value="revival">True Revival vs. Fanaticism</option>
          <option value="teacher">Modeling Christ the Teacher</option>
          <option value="unity">Conflict, Unity, and Healing</option>
        </select>
        <div class="btn-row">
          <button class="btn-primary" id="exploreBtn" onclick="runExplorer()">Explore</button>
          <button class="btn-secondary" onclick="clearExplorer()">Clear</button>
        </div>
        <div class="status"><span class="dot" id="exploreDot"></span><span id="exploreStatus">Select a focus and run.</span></div>
      </div>
    </div>
    <div id="explorerOutput" style="display:none">
      <div class="card">
        <div class="card-hd"><h2 id="explorerTitle">Results</h2></div>
        <div class="card-bd">
          <div class="summary" id="explorerSummary"></div>
          <div class="tablewrap"><table id="explorerTable"></table></div>
          <div class="chips" id="explorerChips"></div>
          <div class="chip-history-note" id="chipNote"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="tabpanel" id="tab-quiz">
    <div class="card">
      <div class="card-hd"><h2>Multiple Choice</h2></div>
      <div class="card-bd">
        <div id="quizMeta" style="display:none; font-size:13px; color:var(--muted); margin-bottom:16px;"><span id="quizMetaText"></span></div>
        <div id="quizContent" style="display:none">
          <div class="question-text" id="questionText"></div>
          <div class="options" id="optionsList"></div>
          <div class="explanation" id="explanationText"></div>
        </div>
        <div class="btn-row">
          <button class="btn-primary" id="newQuizBtn" onclick="runQuiz()">New Quiz</button>
          <button class="btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none">Next Question</button>
          <button class="btn-primary" id="seeResultsBtn" onclick="showResults()" style="display:none">See Results</button>
        </div>
        <div class="status"><span class="dot" id="quizDot"></span><span id="quizStatus">Press New Quiz to begin.</span></div>
      </div>
    </div>
  </div>
</div>

<script>
const PROXY = 'https://groq-proxy.ewalltom.workers.dev';
const MODEL = 'openai/gpt-oss-120b';
const LS_KEY = 'egw-preaching-chips';

const TOPIC = 'Ellen G. White\'s theology of preaching. Key teachings: (1) Christ must be the living center of every sermon — discourses without Christ are "dry and Christless." (2) The Word of God is supreme over impressions, feelings, and current events. (3) Law and gospel must be presented together — the 1888 Minneapolis message by E. J. Waggoner and A. T. Jones on Righteousness by Faith corrected the drift toward legalism. (4) Preaching must reach the heart, not just the intellect. (5) Preachers must personally know Christ before they can preach Him. (6) True revival is characterized by solemnity, deep heart-searching, and genuine repentance — not noise, jumping, or speaking in tongues (White rebuked Ralph Mackin\'s 1908 charismatic experience as "unmeaning gibberish"). (7) Christ\'s preaching style — earnest, simple, dignified — is the model. (8) Preaching that heals divided congregations restores unity and love.';

const FOCUS_PROMPTS = {
  center: 'Christ at the center of preaching: White\'s most urgent directive that Jesus must be the living focus of every discourse. Her warning against "dry and Christless" sermons. The command to "put Christ into every sermon." How Christ-centered preaching softens and subdues the soul in contrast to logical argumentation alone.',
  word: 'The supreme authority of the Word over feelings, impressions, and current events: White\'s warning that "impressions and feelings are no sure evidence that a person is led by the Lord." The danger of replacing Scripture with newspaper headlines, human traditions, or manufactured excitement. The "solid Word of God" as the only reliable foundation for faith.',
  law: 'Law and gospel together: the 1888 General Conference in Minneapolis where E. J. Waggoner and A. T. Jones presented Righteousness by Faith. White\'s endorsement of this message as a corrective to legalism. The principle that "the law is the gospel embodied and the gospel is the law unfolded." How the law acts as a mirror pointing to Christ.',
  heart: 'Reaching the heart: White\'s teaching that a sermon that only convinces the intellect is a failure. "The minister\'s utterances, to be effectual, must reach the hearts of his hearers." The role of the Holy Spirit in preparing hearts. The necessity of making fervent appeals for hearers to forsake sin before the meeting closes.',
  experience: 'The preacher\'s personal experience with Christ: White\'s solemn challenge — "Dare not to preach another discourse until you know, by your own experience, what Christ is to you." The principle that a minister cannot lead others to a Savior they do not personally know. How personal testimony transforms a discourse from lecture to witness.',
  revival: 'True revival versus fanaticism: White\'s contrast between genuine revival (solemnity, heart-searching, confession) and counterfeit revival (noise, physical demonstrations, speaking in tongues). The 1908 Ralph Mackin case — White called his claimed "gift of tongues" "unmeaning gibberish." The pattern of Satan introducing counterfeits wherever God works.',
  teacher: 'Christ as the model for preaching: White\'s directive to study the lessons of Christ and model sermons after the "divine Pattern." Christ\'s style: intensely earnest, simple, direct, dignified — contrasted with oratorical display and flashy rhetoric. "Fine gestures do not constitute a fine discourse." The Master Teacher spoke as one who had seen what He described.',
  unity: 'Preaching as a tool for healing divided congregations: White\'s teaching that conflict in the church is a spiritual deficit remedied through Christ-centered preaching. Sermons that call for repentance, confession, and mutual forgiveness as the foundation for unity. How the baptism of the Holy Spirit through genuine preaching breaks down "I am holier than thou" barriers.'
};

function loadChips() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { return []; } }
function saveChips(arr) { try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); } catch {} }
function addChip(text) { const c = loadChips(); if (!c.includes(text)) { c.push(text); saveChips(c); } }

async function callAI(promptText) {
  const response = await fetch(PROXY, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: promptText }] }], generationConfig: { responseMimeType: 'text/plain' }, model: MODEL })
  });
  const raw = await response.text();
  let data;
  try { data = JSON.parse(raw); } catch { throw new Error(`Non-JSON from proxy (HTTP ${response.status}): ${raw.slice(0,300)}`); }
  if (!response.ok) throw new Error(data?.error?.message || `HTTP ${response.status}`);
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!text) throw new Error('No text in AI response');
  return text;
}

function extractJson(text) {
  let t = String(text).trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) t = fence[1].trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) t = t.slice(a, b + 1);
  try { return JSON.parse(t); } catch { return null; }
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tabpanel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

function setExploreStatus(kind, msg) {
  document.getElementById('exploreDot').className = 'dot ' + (kind || '');
  document.getElementById('exploreStatus').textContent = msg;
}

async function runExplorer(customFocus) {
  const focusKey = document.getElementById('focus').value;
  const focusLabel = customFocus || FOCUS_PROMPTS[focusKey];
  const displayLabel = customFocus || document.getElementById('focus').selectedOptions[0].textContent;
  const btn = document.getElementById('exploreBtn');
  btn.disabled = true;
  document.getElementById('explorerOutput').style.display = 'none';
  setExploreStatus('live', 'Calling AI…');

  const schema = { title: '', summary: '', items: [{ name: '', key_figure_or_date: '', description: '', significance: '' }], follow_up_questions: [''] };

  const prompt = [
    'Return ONLY valid JSON matching the schema exactly. No markdown, no backticks.',
    '', 'SCHEMA:', JSON.stringify(schema, null, 2), '',
    'REQUEST:',
    `Topic: ${TOPIC}`,
    `Focus: ${focusLabel}`,
    'Generate 6-8 items relevant to this focus. Use real names, dates, and specific quotes from White where possible. Be specific and accurate.',
    'key_figure_or_date: the most relevant person, year, or event for this item.',
    'significance: one sentence on why this item matters to understanding White\'s theology of preaching.',
    'follow_up_questions: 3 drill-down questions a curious reader might want answered next.',
    'summary: 2-3 sentences framing this focus within the broader context of White\'s preaching theology.'
  ].join('\n');

  try {
    const text = await callAI(prompt);
    const data = extractJson(text);
    if (!data || !Array.isArray(data.items)) throw new Error('Unexpected response shape.');
    renderExplorer(data, displayLabel);
    setExploreStatus('ok', 'Done.');
  } catch (err) {
    setExploreStatus('bad', 'Error: ' + err.message.slice(0, 140));
  } finally { btn.disabled = false; }
}

function renderExplorer(data, focusLabel) {
  document.getElementById('explorerTitle').textContent = data.title || focusLabel;
  document.getElementById('explorerSummary').textContent = data.summary || '';
  const table = document.getElementById('explorerTable');
  table.innerHTML = '';
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  ['Concept / Person / Event', 'Figure or Date', 'Description', 'Why It Matters'].forEach(h => {
    const th = document.createElement('th'); th.textContent = h; trh.appendChild(th);
  });
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = document.createElement('tbody');
  (data.items || []).forEach(row => {
    const tr = document.createElement('tr');
    [row.name, row.key_figure_or_date, row.description, row.significance].forEach(v => {
      const td = document.createElement('td'); td.textContent = v || '—'; tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  const chipsEl = document.getElementById('explorerChips');
  chipsEl.innerHTML = '';
  const stored = loadChips();
  (data.follow_up_questions || []).filter(Boolean).forEach(q => {
    const div = document.createElement('div');
    div.className = 'chip' + (stored.includes(q) ? ' used' : '');
    div.textContent = q;
    div.onclick = () => { addChip(q); div.classList.add('used'); updateChipNote(); runExplorer(q); };
    chipsEl.appendChild(div);
  });
  document.getElementById('explorerOutput').style.display = '';
  updateChipNote();
}

function updateChipNote() {
  const chips = loadChips();
  document.getElementById('chipNote').textContent = chips.length > 0
    ? `${chips.length} question${chips.length === 1 ? '' : 's'} saved — quiz will draw from your exploration history.` : '';
}

function clearExplorer() {
  document.getElementById('explorerOutput').style.display = 'none';
  setExploreStatus('', 'Select a focus and run.');
}

let batchQuestions = [], batchIndex = 0, batchScore = 0, askedQuestions = [];

function shuffleOptions(q) {
  const letters = ['A','B','C','D'];
  const correctIdx = letters.indexOf(q.correct);
  const texts = q.options.map(opt => opt.replace(/^[A-D]\.\s*/,''));
  const correctText = texts[correctIdx];
  for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [texts[i],texts[j]] = [texts[j],texts[i]]; }
  const newIdx = texts.indexOf(correctText);
  return { ...q, options: texts.map((t,i) => `${letters[i]}. ${t}`), correct: letters[newIdx] };
}

function setQuizStatus(kind, msg) {
  document.getElementById('quizDot').className = 'dot ' + (kind || '');
  document.getElementById('quizStatus').textContent = msg;
}

async function runQuiz() {
  const btn = document.getElementById('newQuizBtn');
  btn.disabled = true;
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('seeResultsBtn').style.display = 'none';
  document.getElementById('quizContent').style.display = 'none';
  document.getElementById('quizMeta').style.display = 'none';
  setQuizStatus('live', 'Generating 5 questions…');

  const chips = loadChips();
  const avoidStr = askedQuestions.length ? 'Do not repeat: ' + askedQuestions.slice(-15).join(' | ') : '';

  let scopeStr;
  if (chips.length > 0) {
    scopeStr = 'Focus questions on these topics the user explored:\n' + chips.map(c => '- ' + c).join('\n') + '\nAlso draw on related foundational concepts as needed.';
  } else {
    scopeStr = 'Cover the full scope: Christ-centered preaching, the 1888 Minneapolis message, E. J. Waggoner and A. T. Jones on Righteousness by Faith, law and gospel, the Word over feelings, genuine vs. fanatical revival, the Ralph Mackin tongues episode (1908), White\'s warnings against oratorical display, the preacher\'s personal experience, reaching the heart vs. intellect alone.';
  }

  const schema = { questions: [{ question: '', options: ['A. ','B. ','C. ','D. '], correct: 'A', explanation: '' }] };

  const prompt = [
    'Return ONLY valid JSON matching the schema exactly. No markdown, no backticks.',
    '', 'SCHEMA:', JSON.stringify(schema, null, 2), '',
    'REQUEST:',
    `Topic: ${TOPIC}`,
    scopeStr,
    'Generate exactly 5 multiple-choice questions. Each must have exactly 4 options (A-D). correct: must be exactly "A", "B", "C", or "D".',
    'Vary question types: quote attribution, event identification, doctrinal principle, historical context, conceptual application.',
    'explanation: 2 sentences explaining why the correct answer is right.',
    avoidStr
  ].filter(Boolean).join('\n');

  try {
    const text = await callAI(prompt);
    const data = extractJson(text);
    if (!data || !Array.isArray(data.questions) || data.questions.length === 0) throw new Error('Unexpected response shape.');
    batchQuestions = data.questions.slice(0,5).map(shuffleOptions);
    batchIndex = 0; batchScore = 0;
    batchQuestions.forEach(q => askedQuestions.push(q.question.slice(0,80)));
    renderQuestion();
    setQuizStatus('ok', 'Choose your answer.');
  } catch (err) {
    setQuizStatus('bad', 'Error: ' + err.message.slice(0,140));
  } finally { btn.disabled = false; }
}

function renderQuestion() {
  const q = batchQuestions[batchIndex];
  document.getElementById('quizMeta').style.display = '';
  document.getElementById('quizMetaText').textContent = `Question ${batchIndex+1} of ${batchQuestions.length}`;
  document.getElementById('questionText').textContent = q.question;
  const optsList = document.getElementById('optionsList');
  optsList.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn'; btn.textContent = opt;
    btn.onclick = () => answerQuestion(letters[idx], q.correct, q.explanation, optsList, letters);
    optsList.appendChild(btn);
  });
  document.getElementById('explanationText').className = 'explanation';
  document.getElementById('explanationText').textContent = '';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('seeResultsBtn').style.display = 'none';
  document.getElementById('quizContent').style.display = '';
}

function answerQuestion(chosen, correct, explanation, optsList, letters) {
  const isCorrect = chosen === correct;
  if (isCorrect) batchScore++;
  Array.from(optsList.children).forEach((btn, idx) => {
    btn.disabled = true;
    if (letters[idx] === correct) btn.classList.add('correct');
    else if (letters[idx] === chosen && !isCorrect) btn.classList.add('wrong');
  });
  const expEl = document.getElementById('explanationText');
  expEl.textContent = (isCorrect ? '✓ Correct! ' : '✗ Incorrect. ') + (explanation || '');
  expEl.className = 'explanation show';
  setQuizStatus(isCorrect ? 'ok' : 'bad', isCorrect ? 'Correct!' : `Incorrect. The answer was ${correct}.`);
  if (batchIndex < batchQuestions.length - 1) document.getElementById('nextBtn').style.display = '';
  else document.getElementById('seeResultsBtn').style.display = '';
}

function nextQuestion() { batchIndex++; document.getElementById('nextBtn').style.display = 'none'; renderQuestion(); setQuizStatus('ok','Choose your answer.'); }

function showResults() {
  document.getElementById('quizContent').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('seeResultsBtn').style.display = 'none';
  document.getElementById('quizMeta').style.display = '';
  document.getElementById('quizMetaText').textContent = `You scored ${batchScore} / ${batchQuestions.length}`;
  const good = batchScore >= Math.ceil(batchQuestions.length / 2);
  setQuizStatus(good ? 'ok' : 'bad', batchScore === batchQuestions.length ? 'Perfect score!' : good ? 'Well done!' : 'Better luck next time!');
}
</script>
</body>
</html>
