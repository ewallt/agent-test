<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="app-version" content="sp-restaurants v1.1 2026-04-29">
  <title>São Paulo Dining Guide</title>
  <style>
    :root {
      --app-bg: #0b1020;
      --card-bg: #111833;
      --input-bg: #1a2347;
      --brand: #8bb9ff;
      --text-body: #e6ecff;
      --text-card: #e6ecff;
      --text-muted: #bcc5e3;
      --border: #26325b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--app-bg);
      color: var(--text-body);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .site-title { font-size: 1.35rem; font-weight: 700; color: var(--brand); transition: color 0.3s; }
    .site-subtitle { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; transition: color 0.3s; }

    .theme-swatches { display: flex; gap: 8px; align-items: center; }
    .swatch {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      outline: none; padding: 0;
    }
    .swatch:hover { transform: scale(1.2); }
    .swatch.active { border-color: var(--text-body); transform: scale(1.15); }

    .tabs {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      justify-content: center;
      overflow-x: auto;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.875rem 1.25rem;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn:hover { color: var(--text-body); }
    .tab-btn.active { color: var(--brand); border-bottom-color: var(--brand); }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 2rem 4rem;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.3rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      transition: border-color 0.2s, background-color 0.3s;
    }
    .card.top-pick { border-left: 3px solid var(--brand); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
    .card-name { font-size: 1rem; font-weight: 700; color: var(--text-card); transition: color 0.3s; }
    .card-stars { font-size: 0.82rem; color: var(--brand); white-space: nowrap; font-weight: 600; transition: color 0.3s; }

    .card-neighborhood {
      display: inline-block;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: var(--input-bg);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 999px;
      font-family: monospace;
      align-self: flex-start;
      transition: color 0.3s, background-color 0.3s, border-color 0.3s;
    }

    .card-highlight {
      font-size: 0.83rem;
      font-style: italic;
      color: var(--brand);
      line-height: 1.45;
      transition: color 0.3s;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.55;
      flex: 1;
      transition: color 0.3s;
    }

    .card-hours {
      font-size: 0.78rem;
      color: var(--text-muted);
      transition: color 0.3s;
    }
    .card-hours strong { color: var(--text-card); font-weight: 500; transition: color 0.3s; }

    .card-note {
      display: inline-block;
      font-size: 0.74rem;
      color: var(--text-muted);
      background: var(--input-bg);
      border-radius: 4px;
      padding: 2px 7px;
      align-self: flex-start;
      transition: color 0.3s, background-color 0.3s;
    }
    .card-note.warning { color: #fbbf24; }

    .card-travel {
      margin-top: 0.3rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      transition: border-color 0.3s;
    }

    .travel-pill {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 0.74rem;
      color: var(--text-muted);
      transition: color 0.3s, background-color 0.3s, border-color 0.3s;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.74rem;
      border-top: 1px solid var(--border);
      transition: color 0.3s, border-color 0.3s;
    }
  </style>
</head>

// ── STATE + RENDER ────────────────────────────────────────────────────────────
const cuisines = [...new Set(RESTAURANTS.map(r => r.cuisine))];
let activeTab = cuisines[0];

function renderTabs() {
  const container = document.getElementById('tabs');
  container.innerHTML = cuisines.map(c =>
    `<button class="tab-btn${c === activeTab ? ' active' : ''}" data-cuisine="${c}">${c}</button>`
  ).join('');
  container.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeTab = btn.dataset.cuisine; renderTabs(); renderCards(); });
  });
}

function fmt(n) {
  if (!n) return '';
  return n >= 1000 ? (n / 1000).toFixed(0) + 'k' : n;
}

function renderCards() {
  const grid = document.getElementById('card-grid');
  const list = RESTAURANTS.filter(r => r.cuisine === activeTab);
  grid.innerHTML = list.map(r => `
    <div class="card${r.topPick ? ' top-pick' : ''}">
      <div class="card-header">
        <div class="card-name">${r.name}</div>
        ${r.stars ? `<div class="card-stars">${r.stars} ★${r.reviews ? ' · ' + fmt(r.reviews) + ' reviews' : ''}</div>` : ''}
      </div>
      <span class="card-neighborhood">${r.neighborhood}</span>
      ${r.highlight ? `<div class="card-highlight">${r.highlight}</div>` : ''}
      <div class="card-desc">${r.description}</div>
      ${r.hours ? `<div class="card-hours">Hours: <strong>${r.hours}</strong></div>` : ''}
      ${r.note ? `<span class="card-note${r.noteWarning ? ' warning' : ''}">${r.note}</span>` : ''}
      <div class="card-travel">
        <span class="travel-pill">📍 ${r.distance}</span>
        <span class="travel-pill">🕐 ${r.driveTime}</span>
        <span class="travel-pill">🚗 ${r.uber}</span>
      </div>
    </div>
  `).join('');
}

// ── THEME SWATCHES ────────────────────────────────────────────────────────────
const root = document.documentElement;
const swatchContainer = document.getElementById('swatches');

const swatchBtns = THEMES.map((theme, i) => {
  const btn = document.createElement('button');
  btn.className = 'swatch' + (i === 0 ? ' active' : '');
  btn.style.background = theme.swatch;
  btn.title = theme.name;
  btn.setAttribute('aria-label', theme.name + ' theme');
  btn.addEventListener('click', () => {
    Object.entries(theme.vars).forEach(([k, v]) => root.style.setProperty(k, v));
    swatchBtns.forEach((b, j) => b.classList.toggle('active', j === i));
  });
  swatchContainer.appendChild(btn);
  return btn;
});

renderTabs();
renderCards();
