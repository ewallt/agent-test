<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="app-version" content="chatgpt-images-use-cases v1.0 2026-04-29">
  <title>ChatGPT Images 2.0 — Use Case Guide</title>
  <style>
    :root {
      --app-bg: #0b1020;
      --card-bg: #111833;
      --input-bg: #1a2347;
      --brand: #8bb9ff;
      --text-body: #e6ecff;
      --text-card: #e6ecff;
      --text-muted: #bcc5e3;
      --border: #26325b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--app-bg);
      color: var(--text-body);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .site-title { font-size: 1.35rem; font-weight: 700; color: var(--brand); transition: color 0.3s; }
    .site-subtitle { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; transition: color 0.3s; }

    .theme-swatches { display: flex; gap: 8px; align-items: center; }
    .swatch {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      outline: none; padding: 0;
    }
    .swatch:hover { transform: scale(1.2); }
    .swatch.active { border-color: var(--text-body); transform: scale(1.15); }

    .tabs {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      justify-content: center;
      overflow-x: auto;
      transition: background-color 0.3s, border-color 0.3s;
    }
    .tabs::-webkit-scrollbar { height: 3px; }
    .tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .tab-btn {
      background: none; border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-muted); cursor: pointer;
      font-size: 0.875rem; font-weight: 500;
      padding: 0.875rem 1.25rem; white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn:hover { color: var(--text-body); }
    .tab-btn.active { color: var(--brand); border-bottom-color: var(--brand); }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 2rem 4rem;
    }

    .tab-intro {
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 720px;
      transition: color 0.3s;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.1rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.2rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color 0.2s, background-color 0.3s;
    }
    .card.top-pick { border-left: 3px solid var(--brand); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
    .card-title { font-size: 0.95rem; font-weight: 700; color: var(--text-card); line-height: 1.3; transition: color 0.3s; }

    .card-tag {
      font-size: 0.68rem;
      color: var(--text-muted);
      background: var(--input-bg);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 999px;
      font-family: monospace;
      white-space: nowrap;
      flex-shrink: 0;
      align-self: flex-start;
      transition: color 0.3s, background-color 0.3s, border-color 0.3s;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.55;
      flex: 1;
      transition: color 0.3s;
    }

    .card-tip {
      font-size: 0.79rem;
      color: var(--brand);
      font-style: italic;
      line-height: 1.45;
      padding-top: 0.35rem;
      border-top: 1px solid var(--border);
      transition: color 0.3s, border-color 0.3s;
    }
    .card-tip::before { content: "Tip: "; font-weight: 600; font-style: normal; }

    .card-note {
      display: inline-block;
      font-size: 0.73rem;
      color: var(--text-muted);
      background: var(--input-bg);
      border-radius: 4px;
      padding: 2px 7px;
      align-self: flex-start;
      transition: color 0.3s, background-color 0.3s;
    }
    .card-note.warning { color: #fbbf24; }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.74rem;
      border-top: 1px solid var(--border);
      transition: color 0.3s, border-color 0.3s;
    }
  </style>
</head>

// ── STATE ────────────────────────────────────────────────────────────────────
const CATEGORIES = [...new Set(USE_CASES.map(u => u.tab))];
let activeTab = CATEGORIES[0];

function renderTabs() {
  const container = document.getElementById('tabs');
  const counts = {};
  CATEGORIES.forEach(c => { counts[c] = USE_CASES.filter(u => u.tab === c).length; });
  container.innerHTML = CATEGORIES.map(c =>
    `<button class="tab-btn${c === activeTab ? ' active' : ''}" data-tab="${c}">${c} <span style="opacity:0.55;font-size:0.78em">${counts[c]}</span></button>`
  ).join('');
  container.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeTab = btn.dataset.tab; renderTabs(); renderCards(); });
  });
}

function renderCards() {
  const intro = document.getElementById('tab-intro');
  intro.textContent = TABS_META[activeTab] || '';

  const grid = document.getElementById('card-grid');
  const list = USE_CASES.filter(u => u.tab === activeTab);
  grid.innerHTML = list.map(u => `
    <div class="card${u.topPick ? ' top-pick' : ''}">
      <div class="card-header">
        <div class="card-title">${u.title}</div>
        ${u.tag ? `<span class="card-tag">${u.tag}</span>` : ''}
      </div>
      <div class="card-desc">${u.desc}</div>
      ${u.tip ? `<div class="card-tip">${u.tip}</div>` : ''}
      ${u.note ? `<span class="card-note${u.note.toLowerCase().includes('still') || u.note.toLowerCase().includes('may') || u.note.toLowerCase().includes('off') ? ' warning' : ''}">${u.note}</span>` : ''}
    </div>
  `).join('');
}

// ── THEME SWATCHES ───────────────────────────────────────────────────────────

const swatchContainer = document.getElementById('swatches');

  btn.style.background = theme.swatch;
  btn.title = theme.name;
  btn.setAttribute('aria-label', theme.name + ' theme');
  btn.addEventListener('click', () => {
    Object.entries(theme.vars).forEach(([k, v]) => root.style.setProperty(k, v));
    swatchBtns.forEach((b, j) => b.classList.toggle('active', j === i));
  });
  swatchContainer.appendChild(btn);
  return btn;
});

renderTabs();
renderCards();
</script>
</body>
</html>
