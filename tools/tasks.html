<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Board</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px 24px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 900px;
    }

    /* Group (Remotion, NotebookLM, Infrastructure) */
    .group-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 12px;
      padding-left: 2px;
    }

    .group-workflows {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Workflow (bar-chart-race, etc.) */
    .workflow {
      background: #1e2330;
      border-radius: 10px;
      overflow: hidden;
    }

    .workflow-header {
      padding: 12px 16px;
      background: #252b3b;
      font-size: 13px;
      font-weight: 600;
      color: #93c5fd;
      letter-spacing: 0.03em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    .workflow-header:hover { background: #2d3548; }

    .workflow-header .chevron {
      font-size: 10px;
      color: #475569;
      transition: transform 0.2s;
    }

    .workflow-header.collapsed .chevron { transform: rotate(-90deg); }

    .workflow-tasks {
      padding: 8px 0;
    }

    .workflow-tasks.hidden { display: none; }

    /* Infrastructure — no workflow sub-label */
    .workflow.no-header .workflow-header { display: none; }
    .workflow.no-header { background: transparent; }
    .workflow.no-header .workflow-tasks { padding: 0; }

    /* Task row */
    .task {
      padding: 10px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      transition: background 0.15s;
      border-left: 3px solid transparent;
    }

    .task:hover { background: #252b3b; }
    .task.expanded { background: #1a2035; border-left-color: #3b82f6; }

    .task-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .status-dot.pending     { background: #475569; }
    .status-dot.in-progress { background: #f59e0b; }
    .status-dot.done        { background: #22c55e; }

    .task-title {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.4;
    }

    .task.done .task-title {
      color: #475569;
      text-decoration: line-through;
    }

    .priority-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .p1 { background: #7f1d1d; color: #fca5a5; }
    .p2 { background: #7c2d12; color: #fdba74; }
    .p3 { background: #713f12; color: #fde68a; }
    .p4 { background: #1e3a5f; color: #93c5fd; }
    .p5 { background: #1e293b; color: #64748b; }

    .task-notes {
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
      padding: 8px 16px 10px calc(16px + 8px + 10px + 3px);
      display: none;
    }

    .task-notes.visible { display: block; }

    /* Legend */
    .legend {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #64748b;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Summary bar */
    .summary {
      font-size: 12px;
      color: #475569;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

<h1>Task Board</h1>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#475569"></div> Pending</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div> In Progress</div>
  <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div> Done</div>
</div>

<div class="summary" id="summary"></div>

<div class="board" id="board"></div>

<script>
async function loadTasks() {
  const res = await fetch('tasks.json');
  return res.json();
}

function priorityLabel(p) {
  const map = { 1: 'P1', 2: 'P2', 3: 'P3', 4: 'P4', 5: 'P5' };
  return map[p] || 'P?';
}

function renderBoard(data) {
  const board = document.getElementById('board');
  let totalTasks = 0, doneTasks = 0, inProgressTasks = 0;

  data.groups.forEach(group => {
    const groupEl = document.createElement('div');
    groupEl.className = 'group';

    const groupLabel = document.createElement('div');
    groupLabel.className = 'group-label';
    groupLabel.textContent = group.label;
    groupEl.appendChild(groupLabel);

    const workflowsEl = document.createElement('div');
    workflowsEl.className = 'group-workflows';

    group.workflows.forEach(workflow => {
      const wfEl = document.createElement('div');
      const isInfra = group.id === 'infrastructure';
      wfEl.className = 'workflow' + (isInfra ? ' no-header' : '');

      if (!isInfra) {
        const header = document.createElement('div');
        header.className = 'workflow-header';
        header.innerHTML = `<span>${workflow.label}</span><span class="chevron">▼</span>`;
        header.addEventListener('click', () => {
          const tasks = wfEl.querySelector('.workflow-tasks');
          const collapsed = tasks.classList.toggle('hidden');
          header.classList.toggle('collapsed', collapsed);
        });
        wfEl.appendChild(header);
      }

      const tasksEl = document.createElement('div');
      tasksEl.className = 'workflow-tasks';

      workflow.tasks.forEach(task => {
        totalTasks++;
        if (task.status === 'done') doneTasks++;
        if (task.status === 'in-progress') inProgressTasks++;

        const taskEl = document.createElement('div');
        taskEl.className = `task ${task.status === 'done' ? 'done' : ''}`;

        const dot = document.createElement('div');
        dot.className = `status-dot ${task.status}`;

        const titleEl = document.createElement('div');
        titleEl.className = 'task-title';
        titleEl.textContent = task.title;

        const badge = document.createElement('div');
        badge.className = `priority-badge p${task.priority}`;
        badge.textContent = priorityLabel(task.priority);

        const left = document.createElement('div');
        left.className = 'task-left';
        left.appendChild(dot);
        left.appendChild(titleEl);

        taskEl.appendChild(left);
        taskEl.appendChild(badge);

        const notesEl = document.createElement('div');
        notesEl.className = 'task-notes';
        notesEl.textContent = task.notes;

        taskEl.addEventListener('click', () => {
          const isExpanded = notesEl.classList.toggle('visible');
          taskEl.classList.toggle('expanded', isExpanded);
        });

        tasksEl.appendChild(taskEl);
        tasksEl.appendChild(notesEl);
      });

      wfEl.appendChild(tasksEl);
      workflowsEl.appendChild(wfEl);
    });

    groupEl.appendChild(workflowsEl);
    board.appendChild(groupEl);
  });

  // Summary
  const pending = totalTasks - doneTasks - inProgressTasks;
  document.getElementById('summary').textContent =
    `${totalTasks} tasks — ${inProgressTasks} in progress · ${pending} pending · ${doneTasks} done`;
}

loadTasks().then(renderBoard);
</script>
</body>
</html>
