      --nav-bg: #0a140d;
      --nav-hover: #162218;
      --nav-active-bg: #52b788;
      --nav-active-text: #0a140d;
      --nav-group: #4a7a5a;
      --footer-bg: #132019;
      --footer-border: #243320;

<body>
  <div id="ai-control-plane" class="sr-only" aria-hidden="true"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SECTIONS = [
      // ── The Brain's Nightly Wash Cycle ──────────────────────────────
      { id:'brain-1', source:"The Brain's Nightly Wash Cycle", title:"The Discovery",
        prose:`It is late at night in a laboratory at the University of Rochester. Dr. Maiken Nedergaard sits alone at a cluttered bench, a microscope in front of her, a fluorescent trace glowing faintly on the monitor beside her. She has just mapped something no one has seen before — a hidden drainage network threaded through the living brain, channels running alongside every blood vessel like a shadow highway. She leans back slowly, the lab's overhead strip lights casting a cold white glow across her face. The camera pushes in on her expression: not triumph, but recognition. She has found the brain's plumbing. In 2012, this was not supposed to exist.`,
        setting:"University of Rochester neuroscience laboratory, late night, 2012",
        subject:"A female researcher alone at a microscope and monitor",
        motion:"Researcher leans back, expression shifting from concentration to stillness; monitor glows behind her",
        lighting:"Cold fluorescent overhead with warm monitor glow; strong chiaroscuro",
        narration:"Discovery of the glymphatic system — the brain's hidden drainage network, identified for the first time by Nedergaard and her team" },
      { id:'brain-2', source:"The Brain's Nightly Wash Cycle", title:"The Hidden Plumbing",
        prose:`Deep beneath a city, ancient stone aqueducts carry dark water silently through vaulted tunnels. Fluid moves in slow, rhythmic pulses — not a torrent, but a deliberate, tidal flow alongside stone pillars and arched walls. This is the closest physical analogy to what lives inside every human skull: a network of fluid-filled channels, lined with a specific water-conducting protein — aquaporin-4 — running in parallel with the brain's blood vessels, moving cerebrospinal fluid outward, sweeping molecular waste toward the body's lymphatic system. A wide tracking shot follows the water as it moves through the tunnel, the camera gliding alongside the current, never faster, never slower.`,
        setting:"Ancient underground stone aqueduct system, near-darkness, ambient torchlight",
        subject:"Slow-moving water through stone channels alongside structural pillars",
        motion:"Steady rhythmic flow of fluid; subtle light reflecting off water surface",
        lighting:"Low amber torchlight; wet stone reflecting dim light from above",
        narration:"How the glymphatic system works — cerebrospinal fluid circulating through channels alongside blood vessels to drain metabolic waste from the brain" },
      { id:'brain-3', source:"The Brain's Nightly Wash Cycle", title:"The Dishwasher",
        prose:`A figure lies in a darkened room, eyes closed, breath slowing into the rhythm of deep sleep. The room is still. Outside a window, a city hums faintly in the background. Somewhere inside this sleeping body, a mechanism has switched on — the norepinephrine pump activating, slow oscillating waves of pressure driving cerebrospinal fluid through the brain's channels. The toxic proteins that built up during the day — beta-amyloid, the precursor to Alzheimer's disease — are now being swept outward and cleared. The camera begins outside the window on the dark street below, then slowly pulls back and tilts upward to reveal the bedroom window above, a single light extinguished. As Maiken Nedergaard herself described it: it is like turning on the dishwasher before you go to bed and waking up with a clean brain.`,
        setting:"Urban apartment bedroom at night, window with city visible below",
        subject:"A sleeping figure in bed, room in near-darkness",
        motion:"Slow, natural breathing motion; distant city lights moving faintly through window",
        lighting:"Near-total darkness inside; faint city glow through window",
        narration:"Deep non-REM sleep as the trigger for glymphatic flow; the norepinephrine pump; clearance of beta-amyloid and tau; Nedergaard's 'dishwasher' quote" },
      { id:'brain-4', source:"The Brain's Nightly Wash Cycle", title:"One Night Without",
        prose:`A figure sits at a glowing laptop in a dark apartment. The clock on the wall reads 2 AM. The building outside is dark — everyone else has gone to sleep. The figure rubs his eyes and keeps working. This is the study: young, healthy volunteers, one night of sleep deprivation, PET scans before and after. The results showed substantial accumulation of beta-amyloid in the very brain regions associated with Alzheimer's disease — after a single missed night. A 25-year follow-up of nearly eight thousand people found that those who slept six hours or less at age fifty had more than a 20 percent increased risk of developing dementia. The camera holds steady on the lone figure at the screen, the apartment dark and silent around him, the blue light of the monitor the only illumination.`,
        setting:"Urban apartment living room, 2 AM, nearly all city lights dark outside",
        subject:"A solitary figure at a laptop, surrounded by darkness",
        motion:"Subtle eye-rub gesture; screen glow flickers slightly as page scrolls",
        lighting:"Single harsh blue-white monitor glow; full darkness elsewhere",
        narration:"One night of sleep deprivation → beta-amyloid accumulation; 25-year study linking short sleep to 20%+ increased dementia risk" },
      { id:'brain-5', source:"The Brain's Nightly Wash Cycle", title:"The Ambien Paradox",
        prose:`A bathroom at 3 AM. The medicine cabinet is open. A hand reaches in and retrieves a small orange prescription bottle — Ambien, zolpidem, one of the most commonly prescribed sleep medications in the world. A glass of water. The pill goes down. What happens next is the paradox: Ambien suppresses the norepinephrine oscillations that drive the brain's wash cycle. The drug intended to help people sleep quietly disables the maintenance process that sleep exists to perform. Ambien and related medications have been associated with a heightened risk of Alzheimer's disease and dementia in multiple studies. None of the commonly used sleep medications have been shown to improve waste clearance. The camera holds in a shallow rack focus — the pill bottle sharp in the foreground, the blurred figure in the mirror behind it — then slowly brings the reflection into focus.`,
        setting:"Bathroom at 3 AM, medicine cabinet open, dim vanity lighting",
        subject:"A hand retrieving a prescription pill bottle; blurred reflection in mirror",
        motion:"Hand reaching for bottle; slow focus pull from bottle to mirror reflection",
        lighting:"Dim vanity bulb; cold clinical light; mirror reflection partially lit",
        narration:"Ambien suppresses norepinephrine pump → reduces glymphatic flow; the pill prescribed for sleep disables the brain's maintenance system; association with Alzheimer's risk" },
      { id:'brain-6', source:"The Brain's Nightly Wash Cycle", title:"The Loop Closes",
        prose:`An older figure sits alone in a dim bedroom before dawn. He has not slept well in years — fewer hours, more interruptions, almost none of the deep slow-wave sleep that once came easily. By his late forties, that deep sleep was already more than 60 percent reduced from what he had as a teenager. Now, in his seventies, it is nearly gone — down 80 to 90 percent. The toxic proteins that his brain no longer clears have begun to accumulate. And those proteins, the research shows, make it harder to sleep. The loop is self-reinforcing: less sleep leads to more buildup; more buildup disrupts sleep further. The camera begins close on his face in profile, pulls back slowly to reveal the window behind him, grey pre-dawn light beginning to fill the sky, the city emerging in silence below.`,
        setting:"Bedroom before dawn, grey pre-dawn light through window, city below",
        subject:"An older man seated in profile near a window",
        motion:"Slow pull-back revealing window and city; dawn light very gradually brightening",
        lighting:"Grey pre-dawn ambient light; no artificial light; gradual brightening",
        narration:"Deep sleep declines dramatically with age (60% by 40s, 80–90% by 70s); the vicious loop — reduced sleep → toxic accumulation → proteins disrupt sleep further; the stakes of the glymphatic system for aging" },

      // ── The Blood Test That Predicts Alzheimer's Decades Early ───────
      { id:'alz-1', source:"The Blood Test That Predicts Alzheimer's Decades Early", title:"Too Late, Too Invasive",
        prose:`A hospital procedure room, fluorescent and cold. A patient lies face-down on an examination table, spine exposed, as a physician prepares a long lumbar needle. This is a spinal tap — the standard method for detecting Alzheimer's neuropathology before the age of the blood test. Down the corridor, another patient slides slowly into a PET scanner, the machine humming at a cost of several thousand dollars. For decades, this was the only way to know what was happening inside a living brain. By the time either test confirmed the disease, the damage had been accumulating for fifteen or twenty years. The camera holds on the needle from behind the patient, then slowly tilts up to follow the physician's face — focused, practiced, and entirely unconcerned with the decades that preceded this moment.`,
        setting:"Hospital procedure room and adjacent imaging suite; clinical fluorescent lighting",
        subject:"A patient undergoing a lumbar puncture; a physician preparing equipment",
        motion:"Physician's hands moving methodically; patient's controlled stillness",
        lighting:"Harsh fluorescent overhead; sterile, cold, institutional",
        narration:"The old diagnostic methods — spinal tap and PET scan — expensive, invasive, and arriving far too late in the disease's progression" },
      { id:'alz-2', source:"The Blood Test That Predicts Alzheimer's Decades Early", title:"The Discovery in Lund",
        prose:`A research building at the University of Lund in Sweden, 2020. Dr. Oskar Hansson sits at a desk reviewing longitudinal data from multiple patient cohorts. A protein marker in the blood — phosphorylated tau at threonine 217, p-Tau217 — has just demonstrated something remarkable: it can track Alzheimer's neuropathology in the brain with nearly 100 percent certainty, from a simple blood draw. No spinal tap. No PET scan. Hansson's summary would later be quoted widely: "The p-tau217 predicted with nearly 100% certainty whether or not the trial participants had Alzheimer's disease pathology in their brains." The camera begins on the data on the screen, then slowly pulls back to reveal Hansson at the desk, the room quiet behind him, winter light coming through a window.`,
        setting:"University research office in Lund, Sweden; winter daylight through a window",
        subject:"A male researcher seated at a desk, reviewing data on a monitor",
        motion:"Researcher leans forward to study the screen; slow pull-back reveals the room",
        lighting:"Cool natural winter daylight from window; warm desk lamp; soft contrast",
        narration:"Discovery of p-Tau217 as a blood-based biomarker; Hansson's finding of near-100% accuracy; 2020 milestone" },
      { id:'alz-3', source:"The Blood Test That Predicts Alzheimer's Decades Early", title:"The 20-Year Clock",
        prose:`An empty room. A grandfather clock against a stone wall, its pendulum swinging in slow, steady arcs. This is the central revelation: Alzheimer's disease does not arrive suddenly. It incubates silently for fifteen to twenty years before the onset of mild cognitive impairment — and p-Tau217 begins rising in the blood more than twenty years before the first symptom appears. Most people diagnosed with Alzheimer's today were already on this trajectory two decades ago, with no way to know. The camera pushes in slowly on the clock face, close enough to see the sweep of the second hand, as the pendulum continues its indifferent rhythm. The disease has been running for twenty years. The clock has been ticking the entire time.`,
        setting:"Stone-walled interior room; a large grandfather clock against the wall",
        subject:"Grandfather clock; slowly moving pendulum and hands",
        motion:"Pendulum swinging; second hand moving; slow push-in on clock face",
        lighting:"Soft, diffuse natural light from an unseen window; warm amber tones",
        narration:"Alzheimer's incubates 15–20 years silently; p-Tau217 detectable more than 20 years before symptoms; the 'window of opportunity' concept" },
      { id:'alz-4', source:"The Blood Test That Predicts Alzheimer's Decades Early", title:"A Vial of Blood",
        prose:`A clinical lab counter. A single glass vial of blood sits in a rack, dark red against the white surface. This is the test — available now, for approximately $200, no needle in the spine, no scanner required. A technician moves it from rack to centrifuge, the camera tracking the vial as it travels. The result will be as accurate as a spinal tap, as informative as a PET scan — and it can even detect changes earlier than those scans can, staging the disease's progression before any other tool can see it. The camera holds in a shallow rack focus on the vial in the foreground, the lab blurred behind it, the technician moving in soft focus.`,
        setting:"Clinical laboratory; clean white counter; lab equipment",
        subject:"A single vial of blood in a sample rack; a lab technician handling it",
        motion:"Technician's hands moving the vial; rack focus shift from vial to background and back",
        lighting:"Bright clinical white light; clean, neutral, precise",
        narration:"The blood test costs ~$200; equal or superior accuracy to CSF and PET; can stage the disease earlier than PET scans; accessible and minimally invasive" },
      { id:'alz-5', source:"The Blood Test That Predicts Alzheimer's Decades Early", title:"The Biomarker Responds",
        prose:`A running trail through a city park in early morning. A figure runs alone, breath visible in cool air, footfalls steady on the path. This is the part that changes everything: p-Tau217 is not a fixed verdict. It is dynamic — it responds to what you do. A study presented at the American Academy of Neurology showed that 54 participants who followed lifestyle improvement recommendations experienced substantial reductions in their p-Tau217 levels compared to a control group. Exercise is one of the key drivers. The camera tracks alongside the runner at shoulder height, moving with the rhythm of the run, the city blurring gently in the background.`,
        setting:"City park running trail; early morning; cool air",
        subject:"A lone runner on a tree-lined path",
        motion:"Runner in steady motion; breath misting; trees passing in background",
        lighting:"Early morning cool light; long shadows; pale golden ambient light through trees",
        narration:"p-Tau217 is dynamic — responds to lifestyle intervention, especially exercise; 54-person AAN study showing biomarker reduction; the test as a feedback mechanism, not a fixed sentence" },
      { id:'alz-6', source:"The Blood Test That Predicts Alzheimer's Decades Early", title:"The Cholesterol Moment",
        prose:`A doctor's office. A physician sits across a desk from a patient, holding a printed lab result. The conversation is unhurried. This is the vision articulated by neurologist Randall Bateman of Washington University Medicine: a future in which checking p-Tau217 is as routine as checking LDL cholesterol — a standard test at the annual physical, followed by lifestyle guidance or medication if levels are elevated. "It'll be just like going to get your blood cholesterol checked and then being given statins if levels are too high." For the first time, primary prevention of Alzheimer's disease — not treatment, not management, but prevention — may be within reach. The camera holds on the lab result in the physician's hands, then slowly tilts up to show both faces: one explaining, one listening, both fully present.`,
        setting:"Doctor's consultation office; warm, unhurried, natural light",
        subject:"A physician and patient in conversation across a desk; lab result paper in hand",
        motion:"Physician gestures gently while explaining; patient nods; paper held in foreground",
        lighting:"Warm natural light from a window; soft, calm, unhurried",
        narration:"Bateman's vision — routine p-Tau217 screening like cholesterol; the possibility of primary Alzheimer's prevention; the arc from diagnosis-too-late to intervention-decades-early" },

      // ── Microplastics: From Arteries to the Brain ────────────────────
      { id:'plastic-1', source:"Microplastics: From Arteries to the Brain", title:"The Invisible Invasion",
        prose:`A supermarket aisle, brightly lit, floor-to-ceiling shelves of bottled water. A shopper reaches for a case and lifts it into her cart without a second thought. The average liter of bottled water contains over 240,000 plastic particles — ninety percent of them nanoplastics, small enough to slip through tissue and enter the bloodstream. Global plastic production now exceeds 400 million tons annually and is expected to double by 2040. More than 600 billion tons have been produced since 1950, and virtually none of it has broken down. It has entered the air we breathe, the water we drink, the food we eat, and the tissue of our organs. The camera tracks slowly along the aisle behind the shopper, aisle lights reflecting off the rows of plastic bottles, the cart rolling forward.`,
        setting:"Supermarket aisle; bright retail lighting; floor-to-ceiling shelves of bottled water",
        subject:"A shopper placing bottled water into a cart; rows of plastic bottles",
        motion:"Shopper's motion; cart rolling; slow camera track behind her",
        lighting:"Bright, even retail fluorescent; clean and commercial",
        narration:"Scale of the plastic crisis — 400M tons annually, 600B cumulative; bottled water as primary ingestion route; 240,000+ particles per liter; the invisibility of the threat" },
      { id:'plastic-2', source:"Microplastics: From Arteries to the Brain", title:"What They Found in the Plaque",
        prose:`An operating theatre in Italy. A surgical team performs a carotid endarterectomy — the removal of atherosclerotic plaque from a patient's artery. The plaque is extracted and examined. Under electron microscopy, among the biological debris: jagged, irregular fragments of polyethylene and polyvinyl chloride. Plastic. Inside an artery. The 2024 New England Journal of Medicine study enrolled 257 patients. In 58 percent of them, plastic was present in the plaque. The camera holds at the edge of the operating theatre — a slow push-in on the surgical team, gloved hands at work, the light above them sharp and focused. Philip Landrigan, who wrote the accompanying editorial, called it "a breakthrough discovery that raises a series of urgent questions."`,
        setting:"Hospital operating theatre; surgical team performing carotid endarterectomy",
        subject:"Surgical team working under a bright overhead lamp; patient on the table",
        motion:"Surgeon's precise, methodical movements; slow push-in on the team",
        lighting:"Harsh surgical overhead spotlight; deep shadows at the edges of the room",
        narration:"The 2024 NEJM arterial plaque study; 257 patients in Italy; 58% had polyethylene in plaque; the first discovery of plastic inside human arterial tissue" },
      { id:'plastic-3', source:"Microplastics: From Arteries to the Brain", title:"The 4.5-Fold Number",
        prose:`A hospital corridor, quiet at night. Through a window, a patient lies in a hospital bed. This is the outcome data: patients whose arterial plaque contained microplastics had a 4.5-fold increase in the composite of all-cause mortality, heart attacks, and strokes during the 34-month follow-up. The plastic particles triggered a marked inflammatory response in the artery wall — elevated TNF-alpha, Interleukin-6, and Interleukin-18, along with collagen breakdown. The plaque weakened. The artery failed. The camera holds in the corridor looking through the window, slightly out of focus through the glass, the patient barely visible in the soft light of the room beyond.`,
        setting:"Hospital corridor at night; window looking into a patient room",
        subject:"A patient in a hospital bed seen through a corridor window",
        motion:"Minimal — gentle ambient motion through the glass; soft light in patient room",
        lighting:"Dark corridor; warm subdued light from the patient room beyond the glass",
        narration:"The 4.5x increased risk of heart attack, stroke, death; the inflammatory mechanism — TNF-alpha, IL-6, IL-18, collagen breakdown; plastic as the trigger for arterial failure" },
      { id:'plastic-4', source:"Microplastics: From Arteries to the Brain", title:"The Brain's Burden",
        prose:`A research lab; tissue samples in glass vials, labeled and catalogued. A researcher works methodically at a bench, processing brain samples donated by individuals who have died. The 2025 Nature Medicine study by Alexander Nihart and colleagues measured microplastic concentrations in three organs: the brain, the liver, and the kidneys. The brain had concentrations 7 to 30 times higher than the other two. From 2016 to 2024, brain accumulation increased by approximately 50 percent. In brains of individuals with dementia, concentrations were 2 to 10 times higher still — a median of 26,076 micrograms per gram, compared to roughly 5,000 in brains without dementia. The camera holds on the researcher's gloved hands handling the sample vials, the rack of labeled specimens behind her, the lab quiet and unhurried.`,
        setting:"Research laboratory; sample storage racks; glass vials catalogued on a bench",
        subject:"A researcher in gloves handling labeled brain tissue samples",
        motion:"Careful handling of vials; methodical movement along the sample rack",
        lighting:"Clean, cool white lab lighting; clinical precision",
        narration:"The 2025 Nature Medicine brain accumulation study; brain concentrations 7–30x higher than liver/kidneys; 50% increase 2016–2024; dementia brains 2–10x higher than normal brains" },
      { id:'plastic-5', source:"Microplastics: From Arteries to the Brain", title:"The Blood-Brain Barrier",
        prose:`A figure stands at a glass wall looking into a dark space beyond — a visual metaphor for the blood-brain barrier, the brain's last line of defense. In a mouse model study published in Science Advances, microplastics injected into the bloodstream were shown to cross this barrier, activate the immune system, reduce blood flow through cerebral capillaries, and induce blood clots. Neurological abnormalities followed. The barrier is not impenetrable. The camera begins outside the glass wall, looking in at the dark interior, then slowly pushes through — crossing the threshold — into the space beyond.`,
        setting:"A glass-walled room with dark interior; the figure standing at the threshold",
        subject:"A lone figure at a glass wall, looking into darkness beyond",
        motion:"Slow push-in through the glass threshold; figure remains still",
        lighting:"Light on the near side of the glass; darkness beyond; harsh contrast at the boundary",
        narration:"Mouse model study — MNPs crossing the blood-brain barrier; immune activation; blood clot formation; neurological abnormalities; the barrier as a failing defense" },
      { id:'plastic-6', source:"Microplastics: From Arteries to the Brain", title:"What You Can Do",
        prose:`A kitchen, morning light through a window. A person fills a glass from a steel water bottle rather than a plastic one. Opens the refrigerator and moves food from a plastic container into a glass dish. The practical guidance is specific: avoid food and drinks packaged in plastic, especially single-use water bottles. Use glass or steel containers for storage. Avoid heating food in plastic — microwaving releases high concentrations of particles. Reduce synthetic fabrics; clean household dust, which harbors microplastics. Avoid fast food and high-fat foods, where toxic plasticizers concentrate. The changes are not dramatic. The camera drifts through the kitchen in a slow, unhurried tracking shot — morning light catching the glass containers on the counter, the steel bottle filling with water.`,
        setting:"Home kitchen; morning light from a window; glass and steel containers on counter",
        subject:"A person making deliberate kitchen choices — glass containers, steel water bottle",
        motion:"Slow tracking through kitchen; hands filling a steel bottle; moving food to glass",
        lighting:"Warm morning natural light; domestic, calm, ordinary",
        narration:"Practical reduction strategies — avoid bottled water, use glass/steel, avoid microwaved plastic, reduce fast food, clean household dust; the message that individual exposure is reducible" },

      // ── Exercise: The Single Most Potent Medical Intervention ────────
      { id:'exercise-1', source:"Exercise: The Single Most Potent Medical Intervention", title:"London, 1958",
        prose:`London, 1958. A red double-decker bus moves through the city in the grey morning light. On the upper deck, a conductor climbs the stairs — again, and again, and again, all day long. Below in the driver's cabin, the driver sits behind the wheel, barely moving. A cardiologist named Jeremy Morris tracked both men across years of data and found something that seems obvious in retrospect but had never been proven: the conductors had dramatically lower rates of heart disease. The bus was the study. The stairs were the intervention. This is where the modern science of exercise began — not in a laboratory, but on a London bus. The camera begins outside, tracking alongside the bus as it moves through the city, then cuts to the conductor ascending the stairs in the rhythm of his work.`,
        setting:"London street, 1958; a red double-decker bus in motion through morning traffic",
        subject:"A bus conductor climbing the internal stairs; a bus driver seated at the wheel",
        motion:"Conductor's repeated stair-climbing; bus moving through traffic; tracking shot alongside the bus",
        lighting:"Grey overcast London morning; diffuse, flat daylight; interior bus lighting warm against the dull street",
        narration:"The 1958 London bus conductor study — the foundational evidence that physical activity protects against heart disease; Jeremy Morris; the beginning of exercise science" },
      { id:'exercise-2', source:"Exercise: The Single Most Potent Medical Intervention", title:"The Drug That Cannot Be Made",
        prose:`A pharmaceutical laboratory. Scientists in white coats work at benches, testing compounds, reviewing results. The voiceover sets up a thought experiment: imagine a drug that reduced cardiovascular disease by 50 percent, reduced the risk of many cancers by 50 percent, outperformed antidepressants in 218 studies involving over 14,000 people, and suppressed inflammation more effectively than GLP-1 weight-loss medications in a randomized trial. Stanford professor Euan Ashley, one of the leaders of the NIH's major exercise research initiative, says plainly: "Exercise may be the single most potent medical intervention ever known." The drug does not exist. The thing that does exist is free. The camera tracks slowly along the laboratory bench, the compounds untested, before pulling back to reveal the empty corridor outside.`,
        setting:"Pharmaceutical research laboratory; white-coated researchers at benches",
        subject:"Lab scientists at work; rows of compound samples; research equipment",
        motion:"Scientists moving methodically; slow tracking along the bench; pull-back to reveal corridor",
        lighting:"Bright, clean laboratory white; clinical precision",
        narration:"Exercise vs. pharmaceuticals — 50% reduction in cardiovascular disease and many cancers; beats SSRIs for depression; beats GLP-1 for inflammation; Ashley's 'single most potent' claim; an exercise pill is impossible" },
      { id:'exercise-3', source:"Exercise: The Single Most Potent Medical Intervention", title:"The Chair",
        prose:`An open-plan office, midday. Row after row of people sitting at desks, hunched toward screens, phones to ears. A study of more than 480,000 people followed for thirteen years found that those who sat mostly at work had a 16 percent higher all-cause mortality and a 34 percent increase in cardiovascular mortality — even after adjusting for other risk factors. Prolonged sitting is not neutral. It is an active health hazard. Eric Topol, one of the leading voices in this research, says simply: there is one thing you do not want to do for any prolonged period. Sit. The camera begins at desk level, a slow tilt up to reveal the full expanse of the open office — screen after screen, person after person, perfectly still.`,
        setting:"Open-plan office; rows of desks and screens; midday fluorescent lighting",
        subject:"Multiple workers seated at screens; an expanse of stationary people",
        motion:"Subtle screen movements; slow tilt up from desk level to full room reveal",
        lighting:"Flat overhead office fluorescent; cold, uniform, institutional",
        narration:"The sitting epidemic — 480,000-person study; 34% increased cardiovascular mortality for mostly-seated workers; sitting as a distinct mortality risk independent of other exercise habits" },
      { id:'exercise-4', source:"Exercise: The Single Most Potent Medical Intervention", title:"The Man in the Shed",
        prose:`A garden shed in Ireland, early morning. A rowing machine sits in the corner, worn from use, facing a window that looks out onto a quiet yard. Richard Morgan first sat down on this machine in his seventies — the first time in his life he had exercised regularly. He is now ninety-three. He has won four world championships in indoor rowing. He has rowed the equivalent of ten times around the globe. Testing at the University of Limerick found that his body is 80 percent muscle and 15 percent fat. His VO2 max — the measure of his cardiovascular capacity — is similar to levels recorded in young adults. The camera pushes slowly in on the rowing machine in the shed, morning light coming through the window, the yard still and quiet outside.`,
        setting:"A garden shed in Ireland; a rowing machine near a window; early morning",
        subject:"A worn rowing machine; quiet domestic surroundings; morning light through the window",
        motion:"Dust motes drifting in early light; slow push-in on the rowing machine",
        lighting:"Soft, diffuse morning natural light through a small window; warm and ordinary",
        narration:"Richard Morgan — 93 years old; started exercising at 70; four-time world rowing champion; 80% muscle; VO2 max of a young adult; proof that it is never too late" },
      { id:'exercise-5', source:"Exercise: The Single Most Potent Medical Intervention", title:"The Muscle You Are Losing",
        prose:`A physical therapy clinic. An older man sits on an examination table. A therapist guides him through a simple test: standing on one leg. He holds for a few seconds — then reaches for the table. Muscle mass begins declining at age fifty. Between sixty and ninety, men lose roughly 33 percent of their muscle mass; women lose 26 percent. Grip strength falls by more than 2 percent per year after fifty. And for individuals who cannot stand on one leg for ten seconds, the risk of all-cause mortality doubles. The camera holds on the man's feet during the balance test — one foot on the ground, the other raised — the slight tremor of effort, the hand reaching for support.`,
        setting:"Physical therapy clinic; examination table; neutral clinical lighting",
        subject:"An older man attempting a one-leg balance test; a therapist observing",
        motion:"The balance attempt; foot lifting; the subtle reach for support",
        lighting:"Neutral clinical daylight; clean, functional, unadorned",
        narration:"Muscle mass decline with age — 33% in men, 26% in women between ages 60–90; grip strength declining 2%/year after 50; one-leg stand test; inability to hold for 10 seconds doubles all-cause mortality risk" },
      { id:'exercise-6', source:"Exercise: The Single Most Potent Medical Intervention", title:"One Minute at a Time",
        prose:`A city park, early morning. A figure walks briskly along a path — not running, not at a gym, just moving. Euan Ashley tells this to every patient who says they do not have enough time to exercise: one minute of exercise buys five extra minutes of life. High-intensity exercise returns seven or eight. Briskly walking 450 minutes per week is associated with living 4.5 years longer. Just 8,800 steps per day correlates with a 60 percent reduction in all-cause mortality. Ten minutes of daily exercise, if adopted across the U.S. adult population, would prevent 110,000 deaths per year. The message is not about perfection. Ashley's advice to patients: habit is everything. Get moving. Don't sit. The camera follows the walker from behind in a smooth tracking shot, the park opening ahead of her, the morning light long and golden across the path.`,
        setting:"City park; paved walking path; early morning golden light",
        subject:"A lone figure walking briskly along a tree-lined path",
        motion:"Walker moving forward; tracking shot from behind; trees and light passing",
        lighting:"Early morning golden hour; long shadows; warm, expansive, hopeful",
        narration:"1 minute = 5 extra minutes of life (Ashley); walking 450 min/week = 4.5 extra years; 8,800 steps = 60% reduction in all-cause mortality; 10 min/day = 110,000 fewer US deaths; habit is everything" },

      // ── Your Biological Clocks ───────────────────────────────────────
      { id:'clocks-1', source:"Your Biological Clocks: Tracking Organ-Specific Aging", title:"The Drop of Blood",
        prose:`A research laboratory, quiet and clinical. A technician in latex gloves places a blood sample — barely two microliters, smaller than a raindrop — into an automated analyzer the size of a small refrigerator. For most of human history, what a doctor knew about a patient's biology came from a handful of numbers: cholesterol, blood pressure, a few metabolic markers. The machine on the bench measures something different. A company called SomaLogic has developed the capacity to detect 11,000 distinct proteins from a sample this small. Not ten biomarkers. Not a hundred. Eleven thousand — each one a signal from somewhere in the body, a message the biology is sending about what it is doing and how it is aging. The camera begins close on the technician's hand placing the sample, then slowly pulls back to reveal the full laboratory: instruments, glowing monitors, rows of catalogued samples.`,
        setting:"Research laboratory; automated analyzer on a bench; rows of processed samples",
        subject:"A technician in gloves placing a blood sample into an analyzer",
        motion:"Precise, deliberate hand motion; monitors glowing in the background; slow pull-back",
        lighting:"Clean, cool white laboratory lighting; clinical and precise",
        narration:"The proteomics revolution — 11,000 proteins measurable from 2μL of blood; SomaLogic and Olink technologies; the scale of the new data layer available to researchers" },
      { id:'clocks-2', source:"Your Biological Clocks: Tracking Organ-Specific Aging", title:"The 11 Clocks",
        prose:`A research lab at a university, late afternoon. A researcher sits at a large monitor, scrolling through a visualization of protein clusters — each cluster corresponding to a specific organ. Heart. Brain. Kidney. Liver. Muscle. Intestine. The work, by Oh and colleagues, drew on data from five separate cohorts involving nearly 6,000 people and assessed close to 5,000 plasma proteins per participant. What emerged from machine learning analysis was not a single aging clock — it was 11. The key insight: your body does not age as one system. Each organ has its own biological age, and those ages can diverge sharply from each other and from the number on your birthday. Your heart may be biologically 58 while your kidneys are 44. The camera holds at medium distance on the researcher and the screen, then pushes slowly in toward the display — the clusters of labeled proteins enlarging as the camera moves.`,
        setting:"University research lab; large monitor displaying protein cluster data; late afternoon",
        subject:"A researcher studying an on-screen visualization of 11 organ-specific protein clusters",
        motion:"Researcher's slow scroll through the data; subtle screen refresh; slow push-in",
        lighting:"Warm ambient lab light; cooler blue glow from the monitor in the foreground",
        narration:"The Oh et al. study — 5 cohorts, 6,000 people, 5,000 proteins, 11 organ aging clocks; the 'organ age gap' — biological age vs. chronological age, per organ; your body is not one clock" },
      { id:'clocks-3', source:"Your Biological Clocks: Tracking Organ-Specific Aging", title:"One in Five",
        prose:`A commuter train, morning rush. Passengers fill the seats and aisles — a cross-section of ordinary people in ordinary clothes, looking at phones, staring out windows, holding coffee. The data, consistent across multiple large studies, found that approximately one in five people is an extreme ager for at least one organ — meaning that organ is physiologically and functionally significantly older than the rest of their body. Only 2 percent of people show accelerated aging across multiple organs simultaneously. There is nothing visible that marks the one-in-five. No outward sign. The camera begins at the far end of the car and tracks slowly forward along the aisle — faces passing, the ordinary morning light through the windows, no one distinguishable from anyone else.`,
        setting:"A commuter train; morning light through windows; passengers seated and standing",
        subject:"A cross-section of commuters — multiple ages and types, unremarkable",
        motion:"Passengers' subtle motion — shifting, reading, staring; slow forward track down the aisle",
        lighting:"Diffuse morning light from train windows; flat and ordinary",
        narration:"1 in 5 are extreme agers for at least one organ; 2% have accelerated aging in multiple organs; no outward signs — the invisible nature of biological age divergence" },
      { id:'clocks-4', source:"Your Biological Clocks: Tracking Organ-Specific Aging", title:"The Heart's Hidden Clock",
        prose:`A hospital cardiology ward. A technician runs an echocardiogram — the ultrasound wand moving across a patient's chest as the machine beside the bed displays the heart's four chambers pulsing in grayscale. The finding from the studies is precise: for every four-year gap between a person's heart's biological age and their chronological age, the risk of heart failure increases 2.5-fold over the following 15 years. Those classified as extreme heart agers face a five-fold increase in heart failure risk compared to normal agers. The heart on the screen does not look alarmed. It keeps beating — rhythmic and indifferent to the arithmetic playing out around it. The camera holds on the ultrasound monitor, shallow depth of field, gently shifting focus from the technician's hands to the image on the screen.`,
        setting:"Hospital cardiology ward; echocardiogram machine and monitor; patient on the table",
        subject:"A technician running an echocardiogram; the heart beating in grayscale on the monitor",
        motion:"Technician's slow wand movement; the rhythmic pulse of the heart on screen; gentle rack focus",
        lighting:"Soft clinical light; cool monitor glow against the dimmer ward",
        narration:"Heart age gap findings — every 4-year gap = 2.5x heart failure risk over 15 years; extreme heart agers = 5x more likely to develop heart failure" },
      { id:'clocks-5', source:"Your Biological Clocks: Tracking Organ-Specific Aging", title:"The Slowest Clockers",
        prose:`A brain imaging suite. An MRI machine hums in a quiet room, and a middle-aged patient slides slowly into the tunnel. The researchers studying body-wide biological age — Argentieri and colleagues, analyzing nearly 3,000 plasma proteins in 45,000 UK Biobank participants — identified a cluster of 204 proteins that predicted not just chronological age, but risk across 18 chronic diseases, including four common cancers and Alzheimer's. Among people in the slowest decile of biological aging — those whose protein signatures indicated the most youthful biology — less than 1 percent developed Alzheimer's disease during follow-up. A young brain is not only a protected brain. It is, in the data, a longer life. The camera holds outside the imaging room, looking in through the observation window — the patient barely visible inside the white tunnel, the machine humming beyond the glass.`,
        setting:"Brain imaging suite; MRI machine; observation window with view into the scan room",
        subject:"A patient entering an MRI tunnel; the machine and the quiet room beyond the glass",
        motion:"Patient sliding into the tunnel; the machine's gentle vibration; static observational hold",
        lighting:"Bright clinical white inside the scan room; dimmer, cooler light in the observation area",
        narration:"The 204-protein body-wide clock — linked to 18 chronic diseases, 4 cancers, Alzheimer's; slow biological agers (bottom decile) had <1% Alzheimer's rate" },
      { id:'clocks-6', source:"Your Biological Clocks: Tracking Organ-Specific Aging", title:"The Gap Is Not Fixed",
        prose:`A farmers' market, early morning. Stalls of vegetables in deep color — red and orange and green, wet from the morning cold. A person moves slowly along the stalls, selecting produce, filling a bag. The research is consistent across multiple large studies: smoking accelerates biological aging across all seven organs assessed in the UK Biobank data. Heavy alcohol use specifically accelerates intestinal aging. A randomized trial of identical twins — same genes, different diet — found that a plant-based diet measurably slowed the pace of biological aging compared to an omnivore diet. Postmenopausal estrogen replacement was associated with slower aging across most organs. The organ age gap is not a verdict. It is a measurement. And measurements can be moved. The camera drifts in a slow tracking shot through the market — the early light long and low across the stalls, the produce vivid in the morning.`,
        setting:"Farmers' market; stalls of fresh vegetables; early morning light",
        subject:"A person moving along the stalls, selecting produce",
        motion:"The person's unhurried movement; market stall motion; slow tracking shot",
        lighting:"Early morning warm golden light; long shadows across the stalls; vivid color",
        narration:"The modifiable gap — smoking accelerates all 7 organs; alcohol accelerates intestinal aging; plant-based diet (identical twins RCT) slows biological aging; the organ age gap as a target, not a fixed fate" },

      // ── Sleep: The Non-Negotiable ────────────────────────────────────
      { id:'sleep-1', source:"Sleep: The Non-Negotiable", title:"What Aging Steals First",
        prose:`A teenager's bedroom, late at night. The room is dark and still. The teenager is deeply asleep — completely under, motionless, breathing slow. This is stage N3: deep, slow-wave NREM sleep, the stage that drives the brain's glymphatic wash cycle, consolidates memory, and releases growth hormone. In your teens and twenties, roughly 20 percent of your sleep is this deep stage. By your late forties, that fraction has already fallen by more than 60 percent. By age seventy, it is down 80 to 90 percent. Sleep does not simply become shorter as you age — it becomes lighter, more fragmented, more easily broken. The camera begins close on the sleeping figure, then slowly pulls back to reveal the quiet room around them — the stillness that becomes harder and harder to reach.`,
        setting:"A teenager's bedroom; late night; dark and completely still",
        subject:"A teenager in deep sleep; motionless, deeply under",
        motion:"Slow, steady breathing; the faintest rise and fall; slow pull-back to reveal the room",
        lighting:"Near darkness; a thin line of light under the door; cool and still",
        narration:"The aging trajectory of deep NREM sleep — already down 60% by late 40s, 80–90% by age 70; fragmentation and reduced sleep efficiency; the progressive loss of the most restorative sleep stage" },
      { id:'sleep-2', source:"Sleep: The Non-Negotiable", title:"The Wrong Assumption",
        prose:`A bedroom at night. A person lies in bed, eyes open, unable to sleep — the clock on the nightstand showing 2:00 AM, then 3:00, then 4:00. The conventional assumption: more sleep is always better. The data from nearly 500,000 UK Biobank participants, 48,000 of whom underwent brain imaging, found something different. The relationship between sleep duration and health is not linear — it is a curve with a peak. About seven hours is optimal. Below that threshold, every hour less increases cardiovascular disease risk by 6 percent. But above it — above seven to eight hours — every additional hour increases cardiovascular risk by 12 percent. Sleeping more than eight hours consistently is associated with a 30 percent heightened risk of all-cause mortality. The assumption that more is better is wrong. The camera holds on the clock face in the dimly lit room, pushing slowly in as the minutes change.`,
        setting:"A darkened bedroom at night; clock on the nightstand showing the early hours",
        subject:"A person awake in bed; the clock marking time",
        motion:"Subtle restlessness in the figure; the clock face changing; slow push-in on the clock",
        lighting:"Near darkness; the soft glow of the clock face; faint ambient light",
        narration:"UK Biobank, 500,000 participants — 7 hours is optimal; the U-shaped curve; below 7–8 hours = +6% cardiovascular risk per hour; above 7–8 hours = +12% per hour; more than 8 hours = 30% heightened all-cause mortality" },
      { id:'sleep-3', source:"Sleep: The Non-Negotiable", title:"One Hour",
        prose:`A hospital emergency department, early morning in March. The corridor is quiet — the overhead lights humming, a gurney moving in the background. Somewhere outside, at 2:00 AM, the clocks have jumped forward one hour. A study examining the transition to daylight saving time — the loss of a single hour of sleep — found a significant rise in heart attacks in both the United States and Germany for four consecutive days after the change. Not a week of deprivation. Not a chronic pattern. One hour. The camera holds at the end of the corridor, still and observational, the gurney moving past in the background — the building quiet, the biology already responding to what was lost.`,
        setting:"Hospital emergency department corridor; early morning; quiet and fluorescent-lit",
        subject:"An empty corridor; a gurney moving in the background; wall clock showing the early hours",
        motion:"The gurney moving past; the hum of overhead lighting; static observational hold",
        lighting:"Institutional overhead fluorescent; flat, cold, institutional",
        narration:"Daylight saving time studies — loss of one hour associated with a significant rise in heart attacks for four consecutive days in the US and Germany" },
      { id:'sleep-4', source:"Sleep: The Non-Negotiable", title:"The Regularity Signal",
        prose:`A kitchen, early morning. The same person, the same mug, the same window light — the ritual of waking at the same hour, every day. Researchers analyzing data from nearly 99,000 UK Biobank participants fitted with sleep trackers developed a metric called the Sleep Regularity Index: the probability that a person is in the same state — asleep or awake — at exactly the same time on any two days twenty-four hours apart. The finding: regularity of the sleep-wake pattern, independently of duration, was strongly correlated with all-cause mortality, cardiovascular mortality, and cancer mortality. Not just how long you sleep. When. The same time. Every day. The camera drifts slowly through the kitchen in a tracking shot — the morning light warm through the window, the ritual ordinary and deliberate.`,
        setting:"A home kitchen; early morning; warm light through a window",
        subject:"A person performing a consistent morning routine — same mug, same time, same light",
        motion:"Slow, unhurried morning motion; light shifting across the counter; slow tracking shot",
        lighting:"Warm early morning natural light; the kitchen calm and domestic",
        narration:"The Sleep Regularity Index — 99,000 UK Biobank participants with sleep trackers; regularity (same sleep/wake time daily) independently predicts all-cause, cardiovascular, and cancer mortality" },
      { id:'sleep-5', source:"Sleep: The Non-Negotiable", title:"What One Night Does",
        prose:`A research laboratory. Young, healthy men in a clinical sleep study — one group allowed a full night's sleep, one group deprived of sleep for a single night. The following morning, researchers took biopsies of adipose tissue and muscle. A single night of sleep deprivation produced measurable pro-inflammatory changes in the transcriptome, proteome, epigenome, and metabolites in the blood — a cascade of molecular disruption visible after one missed night. A separate randomized trial found that coaching people with habitually short sleep to get just 1.2 additional hours per night led to a natural reduction of 270 calories per day in dietary intake — without any nutritional instruction at all. Sleep and metabolism are not separate systems. The camera holds on a researcher in the lab reviewing data on a screen, then slowly pulls back to reveal the clinical beds behind the glass partition — the study participants sleeping under observation.`,
        setting:"A clinical sleep research laboratory; observation room separated by glass; early morning",
        subject:"A researcher reviewing data; study participants visible through a glass partition",
        motion:"Researcher turning from screen to window; slow pull-back to reveal the observation room",
        lighting:"Clinical white in the lab; soft dim light in the sleep room beyond the glass",
        narration:"One night of sleep deprivation — pro-inflammatory changes in adipose tissue and muscle; randomized trial showing 1.2 extra hours of sleep → 270 fewer calories per day naturally; sleep and metabolic regulation are deeply coupled" },
      { id:'sleep-6', source:"Sleep: The Non-Negotiable", title:"What Actually Works",
        prose:`Evening. A bedroom being prepared for sleep — the curtains drawn against the last light, the thermostat turned down, the phone placed face-down across the room. The research is consistent: the same sleep and wake time every day — including weekends — is one of the most protective steps available. Blue light from electronic devices suppresses melatonin and disrupts circadian timing; removing screens from the bedroom measurably improves sleep quality. A cool, dark, and quiet room lowers core body temperature, which is necessary for deep NREM onset. Early time-restricted eating — finishing meals several hours before bed — reduces overnight metabolic load. A weekly nap of one to two times was associated in a large observational study with reduced cardiovascular events. The camera holds at the doorway as the person moves through the room — the curtains closing, the light dimming, the preparations unhurried and deliberate.`,
        setting:"A bedroom being prepared for sleep; early evening; the room growing darker",
        subject:"A person drawing curtains, adjusting the thermostat, setting the phone aside",
        motion:"Curtains closing across fading light; the room dimming deliberately; handheld, quiet",
        lighting:"Warm ambient evening light fading to near-dark as the curtains close",
        narration:"Evidence-based sleep hygiene — same bedtime and wake time daily; no blue light before bed; cool, dark, quiet room; early time-restricted eating; 1–2 weekly naps linked to lower cardiovascular events" },

      // ── The Gut Microbiome and Personalized Nutrition ────────────────
      { id:'gut-1', source:"The Gut Microbiome and Personalized Nutrition", title:"The Same Breakfast",
        prose:`A research dining hall at the Weizmann Institute in Israel, 2015. Participants sit at tables, each eating an identical standardized meal — the same food, the same portion, the same time. On each person's arm, a small sensor: a continuous glucose monitor, measuring blood sugar in real time. The researchers were tracking 800 participants across 1.5 million glucose measurements — responses to more than 5,000 standardized meals and 47,000 ordinary meals. What they found upended a foundational assumption of dietary science: two people eating the exact same food at the exact same time produce radically different blood glucose responses. One spikes sharply. The other barely registers. The camera tracks slowly along the tables — the identical meals in front of each participant, the sensors visible on their arms, each person unknowingly producing a different story inside their body.`,
        setting:"A research dining hall; participants seated at tables with identical meals; daytime",
        subject:"Multiple research participants eating the same standardized meal; CGM sensors visible on arms",
        motion:"Participants eating; the sensors on their arms; slow tracking shot along the tables",
        lighting:"Clean, neutral institutional daylight; overhead research facility lighting",
        narration:"The 2015 Weizmann Institute study — 800 participants, 1.5 million glucose measurements, 5,000+ standardized meals; the core finding: the same food produces wildly different glucose responses in different people" },
      { id:'gut-2', source:"The Gut Microbiome and Personalized Nutrition", title:"40 Trillion Residents",
        prose:`A microbiology laboratory. A researcher in gloves works methodically along a bench of labeled sample tubes — gut microbiome specimens, each from a different participant. A centrifuge spins in the corner. The gut is home to roughly 40 trillion bacteria from approximately 1,000 different species. This internal ecosystem is shaped by everything: what you eat, where you grew up, who you live with, what medications you have taken. When the Weizmann researchers used machine learning to analyze more than 100 factors that could explain the variable glucose responses — genetics, body composition, blood markers — the dominant predictor turned out not to be the genome. It was the microbiome. The camera begins at the far end of the bench, then slowly pushes in along the row of labeled samples — each one a distinct biological world.`,
        setting:"Microbiology research laboratory; centrifuge; rows of labeled sample tubes on a bench",
        subject:"A researcher handling microbiome sample tubes; the centrifuge spinning in the background",
        motion:"Careful handling of tubes; centrifuge motion; slow push-in along the sample bench",
        lighting:"Clean, bright laboratory lighting; clinical whites and cool shadows",
        narration:"The microbiome — 40 trillion bacteria, 1,000 species; shaped by diet, genetics, environment, medications; the Weizmann ML finding: gut microbiome is the key determinant of individual glucose response, outweighing genetics" },
      { id:'gut-3', source:"The Gut Microbiome and Personalized Nutrition", title:"The Twins",
        prose:`Two people sit across from each other at a table — identical twins, same age, same genetics — each eating the same meal. Both have continuous glucose monitors on their arms. A researcher at a laptop reads the data as it streams in. A UK study extending the Weizmann findings included identical twins in its participant group and measured not just glucose but triglycerides as well. The result: even genetically identical people showed marked differences in their nutritional responses. It is not just the DNA. The microbiome — shaped differently by each twin's individual life — was overriding the shared genome. The camera holds at the end of the table, focused on the two sensors, shallow depth of field shifting from one arm to the other as the readings diverge.`,
        setting:"A clinical research setting; a table with two identical meals; twins seated opposite each other",
        subject:"Two identical twins eating the same meal; CGM sensors on both arms; a researcher monitoring data",
        motion:"The twins eating; a researcher watching data stream on a laptop; rack focus between the two sensors",
        lighting:"Neutral clinical daylight; clean, even, unadorned",
        narration:"The UK twin study — identical twins show markedly different nutritional responses; it is not solely genetics; the microbiome overrides shared DNA; glucose alone is insufficient — triglycerides diverge independently" },
      { id:'gut-4', source:"The Gut Microbiome and Personalized Nutrition", title:"What Meat Makes",
        prose:`A butcher counter, late afternoon. A butcher works behind the glass — trimming, wrapping, labeling cuts of red meat. The mechanism is specific: red meat consumption promotes gut bacteria that produce trimethylamine N-oxide, or TMAO, a molecule strongly associated with cardiovascular disease and elevated colon cancer risk. These bacteria also reduce the production of short-chain fatty acids — the compounds that maintain the gut's protective lining and reduce systemic inflammation. A study of more than 21,500 participants across five cohorts found that omnivore gut microbiomes were characterized by bacteria linked to inflammation and adverse cardiometabolic outcomes, while vegan microbiomes were dominated by bacteria that produced the opposite effect. The camera holds behind the butcher counter glass — the cuts of meat in the case, the butcher's practiced hands working in the background.`,
        setting:"A butcher counter; display case of red meat cuts; late afternoon",
        subject:"A butcher trimming and wrapping cuts; the meat displayed in the glass case",
        motion:"The butcher's methodical movements; the case reflecting the shop light; static observational hold",
        lighting:"Cold display case lighting on the meat; warm shop lighting behind the counter",
        narration:"The TMAO mechanism — red meat → gut bacteria → TMAO → cardiovascular disease and colon cancer risk; 21,500-participant study: omnivore vs. vegan microbiome profiles and their inflammatory consequences" },
      { id:'gut-5', source:"The Gut Microbiome and Personalized Nutrition", title:"The Algorithm",
        prose:`A clinic consultation room. A physician shows a patient a tablet displaying their continuous glucose data alongside their microbiome analysis — a personalized dietary recommendation generated by an algorithm. A randomized trial of 225 participants with prediabetes tested this approach directly: one group received algorithmically predicted dietary guidance based on clinical and microbiome data; the other received a standard Mediterranean diet. Over six months, the algorithm-based diet produced significantly better glucose regulation. For people with prediabetes — on the edge of type 2 diabetes — personalized microbiome-informed nutrition may be the intervention that prevents them from crossing the line. The camera holds on the consultation across the desk — the physician and patient looking at the tablet together, the data between them.`,
        setting:"A medical consultation room; a physician and patient at a desk; a tablet between them",
        subject:"A physician showing a patient personalized dietary data on a tablet",
        motion:"The physician turning the tablet toward the patient; the patient leaning in; handheld, close",
        lighting:"Warm office daylight; the tablet screen glowing between the two figures",
        narration:"The randomized trial — 225 prediabetic participants; algorithm-based personalized diet vs. Mediterranean diet; six months; the personalized approach produced significantly better glucose regulation" },
      { id:'gut-6', source:"The Gut Microbiome and Personalized Nutrition", title:"The Kitchen as Medicine",
        prose:`A home kitchen, morning. A person prepares breakfast — lentils and greens on one side of the counter, a jar of yogurt and a bowl of berries on the other, olive oil catching the light. The science is consistent: high-fiber plant-based foods feed bacteria that produce short-chain fatty acids — butyrate, acetate, propionate — which protect the gut lining, suppress inflammation, and improve insulin sensitivity. Fermented foods — yogurt, cheese, kombucha — foster microbiome diversity and reduce the immune-mediated inflammation that accelerates aging. A randomized trial of a high-fiber microbiome-enhanced diet found that participants excreted more than 100 calories per day that their gut bacteria simply did not absorb — some individuals over 400. A study of more than 1,200 older adults on a Mediterranean diet showed reduced frailty, lower inflammation, and improved cognitive function. The camera drifts in a slow tracking shot through the kitchen — the colors vivid, the light warm, the counter arranged like a quiet argument.`,
        setting:"A home kitchen; morning light; lentils, greens, yogurt, berries, and olive oil on the counter",
        subject:"A person preparing a plant-based breakfast; the ingredients visible and colorful",
        motion:"Hands preparing food; olive oil poured; slow tracking shot through the kitchen",
        lighting:"Warm morning natural light through a window; the food vivid and close",
        narration:"Short-chain fatty acids from fiber — butyrate, acetate, propionate; protect gut lining, suppress inflammation, improve insulin sensitivity; fermented foods and microbiome diversity; Mediterranean diet in 1,200+ older adults → less frailty, reduced inflammation, improved cognition" },

      // ── Social Isolation and the Big Picture ─────────────────────────
      { id:'social-1', source:"Social Isolation and the Big Picture", title:"The Empty Table",
        prose:`A kitchen, evening. A person eats alone at a table set for one — no phone, no television, no company. The chair across from them is empty. The window shows a quiet street outside, other lit windows in the buildings beyond. This is not a dramatic scene. It is an ordinary one. Loneliness and social isolation are not conditions that look like illness. They accumulate quietly — in the daily meal without conversation, the evening without company, the week without a visit. A systematic review of 90 cohort studies involving more than 2.2 million people found that loneliness is associated with a 32 percent increased risk of all-cause mortality, a 34 percent rise in cardiovascular mortality, and a 24 percent higher cancer-related mortality. The camera holds across the table — the single place setting, the empty chair, the window beyond.`,
        setting:"A home kitchen; evening; a table set for one",
        subject:"A person eating alone; an empty chair across the table; lit windows visible outside",
        motion:"The person eating quietly; ambient street light shifting through the window; static observational hold",
        lighting:"Warm overhead kitchen light; soft evening glow from the window; ordinary and domestic",
        narration:"The systematic review — 90 cohort studies, 2.2 million people; loneliness associated with 32% higher all-cause mortality, 34% cardiovascular mortality, 24% cancer mortality" },
      { id:'social-2', source:"Social Isolation and the Big Picture", title:"Lifestyle Plus",
        prose:`A physician's office, afternoon. A doctor reviews a patient's chart — the usual markers: blood pressure, cholesterol, BMI, glucose. Then she sets the chart aside and asks a different question. Eric Topol's framework for healthy aging — what he calls "Lifestyle+" — deliberately expands the definition of lifestyle risk beyond diet, exercise, and sleep to include loneliness and social isolation. The expanded list sits alongside environmental toxins, air pollution, and microplastics. Social isolation is not a quality-of-life concern. It is a medical one — as measurable in outcome data as smoking, obesity, or inactivity. The camera holds on the physician's desk — the open chart, the pen set down, the doctor leaning forward to ask what the chart does not ask.`,
        setting:"A physician's office; afternoon; an open patient chart on the desk",
        subject:"A physician setting a chart aside; the patient across the desk",
        motion:"The physician setting down the pen; leaning forward; handheld, close and quiet",
        lighting:"Warm afternoon office light; the chart and desk lit cleanly",
        narration:"Topol's 'Lifestyle+' — social isolation added alongside toxins, diet, exercise, sleep as a medical risk category; loneliness as a clinical variable; the question the standard chart does not ask" },
      { id:'social-3', source:"Social Isolation and the Big Picture", title:"700,000 Veterans",
        prose:`A veterans' community center, midday. A group of men in their sixties and seventies sit around a table — cards dealt, coffee poured, the easy banter of long familiarity. A study of more than 700,000 US veterans analyzed the cumulative effect of eight healthy lifestyle factors: no smoking, physical activity, no excessive alcohol, restorative sleep, good nutrition, stress management, social connections, and no opioid disorder. The result was striking. For men who maintained all eight factors, life expectancy at age forty was extended by 24 years. For women, 20.5 years. Social connection was one of the eight. Not an afterthought — a factor. The camera drifts in a slow tracking shot around the table — the faces in conversation, the cards and coffee, the ordinary texture of regular human contact.`,
        setting:"A veterans' community center; midday; a group of older men at a table",
        subject:"A group of veterans in relaxed conversation — cards, coffee, familiar company",
        motion:"Easy gestures; the group talking; slow tracking shot around the table",
        lighting:"Warm interior daylight; comfortable and unhurried",
        narration:"The 700,000-veteran study — 8 lifestyle factors including social connection; men at 40 with all 8 gained 24 added years; women 20.5 years; social connection as a factor equivalent in scale to diet and exercise" },
      { id:'social-4', source:"Social Isolation and the Big Picture", title:"The Intersection",
        prose:`A public park, afternoon. A person sits alone on a bench — the park busy around them, families and joggers and children passing. A UK Biobank study tracking nearly 400,000 participants over thirteen years examined people with obesity — who, the research shows, are far more likely to experience social isolation and loneliness than those without. Among the 23 percent of participants with obesity, the finding was direct: less loneliness and social isolation was associated with significantly lower all-cause mortality. The biology of body weight and the biology of social connection interact in ways that standard clinical frameworks rarely capture. The camera holds at a distance on the figure on the bench — the park busy and alive around them, the distance between them and the passing world the subject of the frame.`,
        setting:"A public park; afternoon; a person alone on a bench, the park active around them",
        subject:"A solitary figure on a bench; people and activity visible in the background",
        motion:"Park activity passing in the background; the figure still; slight ambient motion",
        lighting:"Open afternoon daylight; warm and unfiltered; the park ordinary and full",
        narration:"UK Biobank, 400,000 participants, 13-year follow-up; among those with obesity — 23% of participants — less loneliness correlated directly with lower all-cause mortality; the intersection of social isolation and metabolic health" },
      { id:'social-5', source:"Social Isolation and the Big Picture", title:"The Machine Question",
        prose:`A small apartment, evening. A young person sits alone on a couch, phone in hand — speaking to it, not typing. The voice coming back is fluent, attentive, unhurried. Researchers are in the early stages of testing whether generative AI tools can reduce loneliness — supplementing or substituting for human interaction in populations at risk. A study using a GPT-3-based tool in a student population experiencing loneliness and suicidal ideation produced encouraging preliminary results. Eric Topol frames the question plainly: we may not like the idea of machines helping our kids avoid suicide, but if such AI works, can we really choose not to use it at least sometimes? The camera holds from across the room — the person on the couch, the phone glowing, the apartment quiet.`,
        setting:"A small apartment; evening; a person alone on a couch with a phone",
        subject:"A young person speaking to an AI on their phone; the apartment otherwise empty",
        motion:"The person's subtle gestures while speaking; the screen glowing; static hold from across the room",
        lighting:"Dim apartment light; the phone's glow; quiet and slightly uncomfortable",
        narration:"Early AI research in loneliness — GPT-3 study in students with loneliness and suicidal ideation; encouraging preliminary results; Topol's ethical framing: if it works, can we choose not to use it?" },
      { id:'social-6', source:"Social Isolation and the Big Picture", title:"What the Assessment Looks Like",
        prose:`A doctor's office, late afternoon. A physician works through a structured conversation with an older patient — not reviewing lab results but mapping the social landscape: Do you live alone? Do family members visit? Do you participate in any weekly groups? Is there someone you call when something is wrong? Topol's prescription is direct: assessing lifestyle+ factors must include the extent to which a person experiences social isolation and loneliness, and actively deploying countermeasures — community programs, group activities, weekly contact, and where necessary, new tools. The camera begins on the physician's hands as she writes — then slowly pulls back to reveal the consultation in full, the patient across the desk, the window behind them, the ordinary room where a different kind of clinical question is being asked.`,
        setting:"A physician's office; late afternoon; the physician writing, the patient across the desk",
        subject:"A physician conducting a social isolation assessment; an older patient",
        motion:"The physician writing and asking; the patient responding; slow pull-back to reveal the full room",
        lighting:"Late afternoon warm light through the window; the consultation quiet and deliberate",
        narration:"Topol's clinical prescription — assess social isolation as part of the standard Lifestyle+ review; countermeasures: community programs, regular contact, new tools; social connection as a clinical intervention, not a soft afterthought" },
    ];

    const ENGAGEMENT_MODES = [
      { group: "Foundations", options: ["Explain it simply", "Key insight", "Expand with examples"] },
      { group: "Lenses", options: ["Compare / contrast", "Biographical moment", "So what — why does this matter today?", "Connections — what did this influence?"] },
      { group: "Challenge", options: ["Skeptic's view", "Counterfactual — what if this hadn't happened?"] },
    ];

    const ALL_MODES = ENGAGEMENT_MODES.flatMap(g => g.options);

    const GIC_INSTRUCTIONS = `For Gemini in Chrome: When a menu option is active, respond to this section using that lens. Skip preamble. Write in clear paragraphs, be engaging, match length to complexity. Format your response using bullet points. Respond in plain text, never HTML.
- "Explain it simply" = plain explanation for a beginner.
- "Key insight" = the most crucial underlying theme.
- "Expand with examples" = rich expansion with concrete examples.
- "Compare / contrast" = compare to what came before/after; what contemporaries thought vs. what history decided.
- "Biographical moment" = what was happening in this person's life at this moment; what drove this decision or obsession.
- "So what — why does this matter today?" = why this still matters; what it changes about how we see the world.
- "Connections — what did this influence?" = downstream influence; cross-domain connections.
- "Skeptic's view" = the strongest critique; what rejectors thought they were seeing.
- "Counterfactual — what if this hadn't happened?" = what would be missing; who almost got here first.`;

    const SOURCES = [...new Set(SECTIONS.map(s => s.source))];

    function MetaAside({ setting, subject, motion, lighting, narration }) {
      return (
        <div className="meta-aside">
          <div className="meta-row"><span className="meta-label">Setting</span>{setting}</div>
          <div className="meta-row"><span className="meta-label">Subject</span>{subject}</div>
          <div className="meta-row"><span className="meta-label">Motion</span>{motion}</div>
          <div className="meta-row"><span className="meta-label">Lighting</span>{lighting}</div>
          <div className="meta-row"><span className="meta-label">Narration</span>{narration}</div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState(SECTIONS[0].id);
      const [activeMode, setActiveMode] = useState(null);
      const [menuOpen, setMenuOpen] = useState(false);
      const [isDark, setIsDark] = useState(false);
      const [mobileNavOpen, setMobileNavOpen] = useState(false);
      const menuRef = useRef(null);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', isDark);
      }, [isDark]);

      useEffect(() => {
        const handler = (e) => {
          if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false);
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);

      const handleTabChange = (id) => {
        setActiveTab(id);
        setActiveMode(null);
        setMenuOpen(false);
        setMobileNavOpen(false);
      };

      const handleModeSelect = (mode) => {
        setActiveMode(prev => prev === mode ? null : mode);
        setMenuOpen(false);
      };

      const current = SECTIONS.find(s => s.id === activeTab);

      const NavContent = () => (
        <nav style={{ backgroundColor: 'var(--nav-bg)' }} className="h-full overflow-y-auto pt-2 pb-20">
          {SOURCES.map(source => {
            const items = SECTIONS.filter(s => s.source === source);
            return (
              <div key={source} className="mb-1">
                <div className="font-ui px-3 py-1.5 text-xs font-semibold uppercase tracking-widest" style={{ color: 'var(--nav-group)', fontSize: '0.65rem' }}>
                  {source}
                </div>
                {items.map(section => (
                  <button
                    key={section.id}
                    onClick={() => handleTabChange(section.id)}
                    className="w-full text-left px-4 py-2 text-sm font-ui transition-colors duration-150"
                    style={{
                      backgroundColor: activeTab === section.id ? 'var(--nav-active-bg)' : 'transparent',
                      color: activeTab === section.id ? 'var(--nav-active-text)' : 'var(--text-body)',
                      fontWeight: activeTab === section.id ? '600' : '400',
                      fontSize: '0.8rem',
                    }}
                    onMouseEnter={e => { if (activeTab !== section.id) e.currentTarget.style.backgroundColor = 'var(--nav-hover)'; }}
                    onMouseLeave={e => { if (activeTab !== section.id) e.currentTarget.style.backgroundColor = 'transparent'; }}
                  >
                    {section.title}
                  </button>
                ))}
              </div>
            );
          })}
        </nav>
      );

      return (
        <div style={{ minHeight: '100vh', backgroundColor: 'var(--app-bg)' }}>
          {/* Header */}
          <header className="font-ui fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4 py-3 border-b" style={{ backgroundColor: 'var(--card-bg)', borderColor: 'var(--border)', height: '52px' }}>
            <div className="flex items-center gap-3">
              <button className="md:hidden p-1 rounded" onClick={() => setMobileNavOpen(v => !v)} style={{ color: 'var(--text-muted)' }}>
                <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
              </button>
              <span className="font-semibold text-sm tracking-tight" style={{ color: 'var(--text-heading)' }}>
                Layered Reader <span className="font-normal" style={{ color: 'var(--brand)' }}>— Healthy Aging</span>
              </span>
            </div>
            <span className="hidden md:block text-xs" style={{ color: 'var(--text-muted)' }}>Nine ways to engage: foundations, lenses, and challenges.</span>
            <button onClick={() => setIsDark(v => !v)} className="p-1.5 rounded-full transition-colors" style={{ backgroundColor: 'var(--input-bg)', color: 'var(--text-muted)' }} title="Toggle light/dark">
              {isDark
                ? <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><circle cx="12" cy="12" r="4"/></svg>
                : <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              }
            </button>
          </header>

          {/* Mobile nav overlay */}
          {mobileNavOpen && (
            <div className="md:hidden fixed inset-0 z-40" style={{ top: '52px' }}>
              <div className="absolute inset-0" style={{ backgroundColor: 'rgba(0,0,0,0.4)' }} onClick={() => setMobileNavOpen(false)} />
              <div className="absolute left-0 top-0 bottom-0 w-72 z-50 overflow-hidden" style={{ backgroundColor: 'var(--nav-bg)' }}>
                <NavContent />
              </div>
            </div>
          )}
