          {/* Desktop nav */}
          <div className="hidden md:block fixed left-0 bottom-0 w-64 z-30 overflow-hidden border-r" style={{ top: '52px', borderColor: 'var(--border)', backgroundColor: 'var(--nav-bg)' }}>
            <NavContent />
          </div>

          {/* Main content */}
          <main className="md:ml-64 pb-24" style={{ paddingTop: '52px' }}>
            <article className="max-w-2xl mx-auto px-6 py-10">
              {/* GiC instruction (hidden) */}
              <div className="sr-only">{GIC_INSTRUCTIONS}{activeMode ? `\n\nActive mode: "${activeMode}"` : ''}</div>

              <header className="mb-6">
                <p className="font-ui text-xs font-semibold uppercase tracking-widest mb-2" style={{ color: 'var(--brand)' }}>{current.source}</p>
                <h1 className="text-2xl font-bold leading-snug" style={{ color: 'var(--text-heading)', fontFamily: 'Merriweather, serif' }}>{current.title}</h1>
              </header>

              <div className="prose-content leading-loose text-base" style={{ color: 'var(--text-body)', lineHeight: '1.9' }}>
                <p>{current.prose}</p>
              </div>

              <MetaAside
                setting={current.setting}
                subject={current.subject}
                motion={current.motion}
                lighting={current.lighting}
                narration={current.narration}
              />
            </article>
          </main>

          {/* Footer */}
          <footer
            ref={menuRef}
            className="fixed bottom-0 right-0 z-50 border-t font-ui"
            style={{
              left: '0',
              backgroundColor: 'var(--footer-bg)',
              borderColor: 'var(--footer-border)',
            }}
          >
            <div className="md:ml-64 px-4 py-3 flex items-center gap-3">
              <div className="relative">
                <button
                  onClick={() => setMenuOpen(v => !v)}
                  className="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-colors"
                  style={{
                    backgroundColor: activeMode ? 'var(--mode-active-bg)' : 'var(--input-bg)',
                    color: activeMode ? 'var(--mode-active-text)' : 'var(--text-body)',
                    minWidth: '200px',
                  }}
                >
                  <span className="truncate">{activeMode || 'Choose a lens…'}</span>
                  <svg className="ml-auto flex-shrink-0" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <path d={menuOpen ? "M18 15l-6-6-6 6" : "M6 9l6 6 6-6"}/>
                  </svg>
                </button>

                {menuOpen && (
                  <div className="absolute bottom-full mb-2 left-0 rounded-xl border shadow-xl overflow-hidden" style={{ backgroundColor: 'var(--card-bg)', borderColor: 'var(--border)', width: '260px', zIndex: 100 }}>
                    {ENGAGEMENT_MODES.map(({ group, options }) => (
                      <div key={group}>
                        <div className="px-4 py-2 text-xs font-bold uppercase tracking-widest" style={{ color: 'var(--text-muted)', borderBottom: `1px solid var(--border)` }}>{group}</div>
                        {options.map(opt => (
                          <button
                            key={opt}
                            onClick={() => handleModeSelect(opt)}
                            className="w-full text-left px-4 py-2.5 text-sm transition-colors"
                            style={{
                              backgroundColor: activeMode === opt ? 'var(--brand-light)' : 'transparent',
                              color: activeMode === opt ? 'var(--brand)' : 'var(--text-body)',
                              fontWeight: activeMode === opt ? '600' : '400',
                            }}
                            onMouseEnter={e => { if (activeMode !== opt) e.currentTarget.style.backgroundColor = 'var(--input-bg)'; }}
                            onMouseLeave={e => { if (activeMode !== opt) e.currentTarget.style.backgroundColor = 'transparent'; }}
                          >
                            {opt}
                          </button>
                        ))}
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {activeMode && (
                <p className="text-xs hidden md:block" style={{ color: 'var(--text-muted)' }}>
                  Mode active — type <strong>go</strong> in Gemini to engage
                </p>
              )}
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
